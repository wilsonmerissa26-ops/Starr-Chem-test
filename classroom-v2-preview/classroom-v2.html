<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dr. Merissa's Classroom V2</title>
<style>
:root{--bg:#eef1f0;--panel:#fff;--ink:#15252d;--muted:#64747a;--line:#cbd5d2;--good:#2d745f;--info:#eef4f2}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;min-height:50px;border:0;border-radius:12px;padding:12px 16px;background:var(--ink);color:#fff;font-weight:800;width:100%;margin-top:10px}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.linkish{background:transparent;color:var(--ink);border:0;text-decoration:underline}.top{position:sticky;top:0;z-index:10;background:rgba(238,241,240,.97);border-bottom:1px solid var(--line)}.topin{max-width:900px;margin:auto;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--ink);color:white;font-weight:900}.brand small{display:block;color:var(--muted)}.menu{width:auto;margin:0;background:#fff;color:var(--ink);border:1px solid var(--line)}.shell{max-width:900px;margin:auto;padding:18px 14px 100px}.hero{padding:18px 0}.hero h1,h1{font-size:clamp(30px,7vw,46px);margin:4px 0 10px}.hero p,p{line-height:1.5}.eyebrow{font-size:11px;letter-spacing:.13em;font-weight:900;color:var(--muted)}.lane-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.lane,.card,.demo,.teacher{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0}.lane{display:flex;flex-direction:column;min-height:280px}.lane p{color:var(--muted);flex:1}.lane h2{margin:6px 0}.teacher{display:flex;gap:12px;align-items:flex-start}.teacher .bubble{line-height:1.55;flex:1}.path{display:flex;gap:6px;overflow:auto;padding:4px 0 8px}.path span{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:11px;color:var(--muted)}.path .on{background:var(--ink);color:#fff;border-color:var(--ink)}.visual{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(28px,8vw,48px);font-weight:900;text-align:center;padding:28px 10px}.demo-title,.progress,.stepcount{color:var(--muted);font-weight:800}.stepcount{text-align:center}.pulse{animation:pulse .45s ease}@keyframes pulse{from{transform:scale(.95);opacity:.4}to{transform:scale(1);opacity:1}}.question{font-size:23px;font-weight:850;line-height:1.35;margin:8px 0 14px}.card input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;font-size:18px}.good,.info{margin-top:12px;padding:13px;border-radius:12px;line-height:1.5}.good{background:#e8f3ee;color:#205745}.info{background:var(--info);color:#41545b}.note{background:#fffdf3}.counter{display:flex;justify-content:space-around;gap:12px;margin-top:12px}.counter span{text-align:center}.counter b{font-size:24px;display:block}.molecule{min-height:190px;display:grid;place-content:center;text-align:center;font:900 clamp(25px,7vw,42px)/1.05 ui-monospace,monospace;white-space:pre}.stage{height:260px;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;background:#fafcfc;color:var(--muted);font-weight:800;margin:12px 0}.footer-actions{margin-top:20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;font-size:18px;margin-top:10px}@media(max-width:760px){.lane-grid{grid-template-columns:1fr}.lane{min-height:0}.choices{grid-template-columns:1fr}.teacher{align-items:flex-start}.avatar{width:42px;height:42px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand"><div class="avatar">DM</div><div><b>Dr. Merissa's Classroom</b><small id="where">Classroom Home</small></div></div><button class="menu" onclick="ClassroomV2.goHome()">Classroom</button></div></div>
<main class="shell"><section id="screen"></section></main>
<script src="classroom-v2-data.js"></script>
<script src="classroom-v2-engine.js"></script>
<script src="molecule-stage.js"></script>
<script src="classroom-v2-app.js"></script>
<script src="classroom-v2-diagnosis.js"></script>
</body>
</html>
