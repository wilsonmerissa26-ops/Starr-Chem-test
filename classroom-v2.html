<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dr. Merissa's Classroom V2</title>
<style>
:root{--bg:#eef1f0;--panel:#fff;--ink:#16232b;--muted:#586970;--line:#c9d3d1;--soft:#f6f8f7;--good:#2e7d6b;--warn:#b8860b;--bad:#b5533c;--accent:#24343d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:rgba(238,241,240,.97);border-bottom:1px solid var(--line)}.topin{max-width:820px;margin:auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;gap:10px;align-items:center}.dm{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:800}.brand small{display:block;color:var(--muted)}.menu{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-weight:700}.shell{max-width:820px;margin:auto;padding:16px 14px 90px}.hero{padding:18px 0}.hero h1{font-size:clamp(28px,7vw,44px);margin:4px 0 8px}.hero p{font-size:17px;line-height:1.5;color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.lane{display:flex;flex-direction:column;min-height:250px}.lane h2{margin:4px 0 8px}.lane p{color:var(--muted);line-height:1.45}.lane .spacer{flex:1}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}.btn{width:100%;min-height:50px;border-radius:11px;border:1px solid var(--ink);background:var(--ink);color:white;font-weight:750;padding:11px 14px}.btn.alt{background:white;color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.good{background:var(--good);border-color:var(--good)}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{width:auto}.teacher{display:flex;gap:12px;align-items:flex-start}.avatar{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;flex:none}.bubble{flex:1;background:white;border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.55}.path{display:flex;gap:6px;overflow:auto;padding:4px 0 10px}.path span{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:11px;color:var(--muted)}.path span.on{background:var(--ink);color:#fff;border-color:var(--ink)}.board{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;min-height:190px}.eq{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(25px,7vw,42px);text-align:center;margin:16px 0}.caption{color:var(--muted);line-height:1.45;text-align:center}.animBox{position:relative;min-height:240px;display:grid;place-items:center;overflow:hidden}.power{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;font-size:clamp(30px,9vw,56px);transition:.45s ease;transform:translateY(0);opacity:1}.power.flip{transform:translateY(-28px);opacity:.12}.answer{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;font-size:clamp(28px,8vw,50px);position:absolute;opacity:0;transform:translateY(30px);transition:.45s ease}.answer.show{opacity:1;transform:translateY(0)}.balance{display:flex;align-items:flex-end;justify-content:center;gap:34px;min-height:200px}.side{width:135px;min-height:110px;border-bottom:7px solid var(--ink);display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:6px;padding-bottom:6px;transition:.4s}.block{padding:8px 10px;border-radius:8px;background:#e8eeee;border:1px solid var(--line);font-family:ui-monospace,monospace;font-weight:700}.minus{opacity:0;transform:translateY(8px);transition:.4s;color:var(--bad);font-weight:800}.minus.show{opacity:1;transform:none}.numberline{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}.num{width:58px;height:58px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:#fff;font-size:22px;font-weight:800;transition:.35s}.num.active{transform:scale(1.08);border-color:var(--good);box-shadow:0 0 0 3px rgba(46,125,107,.12)}.atomStage{position:relative;height:300px;background:#fbfcfc;border:1px solid var(--line);border-radius:15px;overflow:hidden}.atom{position:absolute;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:white;border:3px solid var(--ink);font-weight:800;opacity:0;transform:scale(.65);transition:.45s}.atom.show{opacity:1;transform:scale(1)}.bond{position:absolute;height:4px;background:var(--ink);transform-origin:left center;opacity:0;transition:.45s}.bond.show{opacity:1}.pair{position:absolute;font-weight:900;font-size:26px;opacity:0;transition:.45s}.pair.show{opacity:1}.counter{display:flex;justify-content:space-around;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:white;padding:10px}.counter div{text-align:center}.counter b{display:block;font-size:22px}.counter small{color:var(--muted)}.q{font-size:23px;font-weight:800;line-height:1.3;margin-bottom:12px}.input{width:100%;border:1px solid var(--line);background:white;border-radius:11px;padding:13px;font-size:18px}.feedback{margin-top:10px;padding:12px;border-radius:11px;line-height:1.45}.feedback.good{background:#e9f4f1;color:#21594d}.feedback.bad{background:#faefec;color:#7b3427}.feedback.info{background:#f3f6f5;color:#43545c}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choice{min-height:50px;border:1px solid var(--line);border-radius:11px;background:white;font-weight:700}.status{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.chip{border:1px solid var(--line);border-radius:10px;padding:10px}.chip b{display:block}.chip small{color:var(--muted)}.hidden{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}.lane{min-height:0}.status{grid-template-columns:1fr}.balance{gap:16px}.side{width:120px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand"><div class="dm">DM</div><div><b>Dr. Merissa's Classroom</b><small id="where">Classroom Home</small></div></div><button class="menu" onclick="goHome()">Classroom</button></div></div>
<main class="shell"><section id="screen"></section></main>
<script>
const KEY='astarryia-classroom-v2-preview';
const fresh={screen:'home',targeted:{skill:'logs',stage:'teach',q:0,correct:0,seen:[]},foundation:{stage:'teach',q:0},chem:{stage:'teach',watchStep:0,togetherStep:0,q:0},last:null};
let state=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&typeof x==='object'?Object.assign(structuredClone(fresh),x):structuredClone(fresh)}catch(e){return structuredClone(fresh)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function setWhere(t){document.getElementById('where').textContent=t}
function goHome(){state.last=state.screen;state.screen='home';save();render()}
function resetPreview(){localStorage.removeItem(KEY);state=structuredClone(fresh);render()}
function path(active){const a=['Teach','Watch','Do It With Me','Guided Practice','Try It Alone','Fresh Check'];return `<div class="path">${a.map(x=>`<span class="${x===active?'on':''}">${x}</span>`).join('')}</div>`}
function teacher(text){return `<div class="teacher"><div class="avatar">DM</div><div class="bubble">${text}</div></div>`}
function render(){const s=document.getElementById('screen');if(state.screen==='home'){setWhere('Classroom Home');s.innerHTML=home();return}if(state.screen==='targeted'){setWhere('Targeted Math Plan');s.innerHTML=targeted();return}if(state.screen==='foundation'){setWhere('Foundational Math Academy');s.innerHTML=foundation();return}if(state.screen==='chem'){setWhere('Chemistry Foundation');s.innerHTML=chem();setTimeout(syncChemVisual,0);return}}
function home(){return `<div class="hero"><div class="kicker">Choose your learning lane</div><h1>What do you want to work on?</h1><p>You can start with Math or Chemistry, switch whenever you need to, and come back without losing your place.</p></div><div class="grid"><div class="card lane"><div class="kicker">Plan-based math</div><h2>Targeted Math Plan</h2><p>Logs, algebra, exponents, scientific notation, fractions/percentages, and unit conversions from the locked Day 1 preparation plan.</p><div class="spacer"></div><button class="btn" onclick="openLane('targeted')">${state.targeted.stage==='teach'&&state.targeted.q===0?'Start':'Continue'} Targeted Math</button></div><div class="card lane"><div class="kicker">Deep math foundation</div><h2>Foundational Math Academy</h2><p>Number sense, mental strategies, visual models, decomposition, estimation, patterns, and reasoning.</p><div class="spacer"></div><button class="btn" onclick="openLane('foundation')">${state.foundation.stage==='teach'?'Start':'Continue'} Foundational Math</button></div><div class="card lane"><div class="kicker">Day 1 chemistry</div><h2>Chemistry Foundation</h2><p>Valence electrons, bonds, lone pairs, octets, and Lewis structures with visual molecule teaching.</p><div class="spacer"></div><button class="btn" onclick="openLane('chem')">${state.chem.stage==='teach'?'Start':'Continue'} Chemistry</button></div></div><div class="card"><button class="btn ghost" onclick="resetPreview()">Reset this preview only</button></div>`}
function openLane(x){state.screen=x;save();render()}

const logQs=[
{id:'l1',q:'log(10,000) = ?',a:'4',why:'10⁴ = 10,000, so log(10,000) = 4.'},
{id:'l2',q:'If log(x) = -4, what is x?',a:'0.0001',alt:['10^-4','10⁻⁴'],why:'log(x) = -4 means 10⁻⁴ = x. That is 0.0001.'},
{id:'l3',q:'Estimate -log(6 × 10⁻⁶) to one decimal.',a:'5.2',tol:.15,why:'-log(6×10⁻⁶) = 6 - log(6). Using log(2)≈0.30 and log(3)≈0.48 gives log(6)≈0.78, so the answer is about 5.2.'},
{id:'l4',q:'log(1,000,000) = ?',a:'6',why:'10⁶ = 1,000,000, so the logarithm is 6.'},
{id:'l5',q:'Estimate -log(5 × 10⁻⁴).',a:'3.3',tol:.15,why:'4 - log(5) ≈ 4 - 0.70 = 3.3.'}
];
function targeted(){const t=state.targeted;if(t.stage==='teach')return targetedTeach();if(t.stage==='watch')return targetedWatch();if(t.stage==='together')return targetedTogether();if(t.stage==='guided')return targetedQuestions('Guided Practice',0,3);if(t.stage==='alone')return targetedQuestions('Try It Alone',3,5);return targetedFresh()}
function targetedTeach(){return `<div class="hero"><div class="kicker">Targeted Math Plan · Logs & Estimation</div><h1>First, understand what a log is.</h1><p>We are not starting with a quiz. Dr. Merissa teaches the relationship first.</p></div>${path('Teach')}${teacher(`<b>A logarithm is a power question asked backward.</b><br><br>You already understand a forward statement like <b>10³ = 1,000</b>. A log asks: <b>10 to what power gives 1,000?</b> The answer is still 3.`)}<div class="card"><div class="eq">10³ = 1,000</div><div class="caption">Forward relationship: ten raised to the third power equals one thousand.</div></div><div class="card"><button class="btn" onclick="setTargetStage('watch')">Show me visually</button></div>`}
function targetedWatch(){return `<div class="hero"><div class="kicker">Logs & Estimation</div><h1>Watch the relationship flip.</h1></div>${path('Watch')}${teacher(`Tap the button one step at a time. I want you to see that the math fact stays the same; only the question changes.`)}<div class="card"><div class="animBox"><div id="pwr" class="power">10³ = 1,000</div><div id="logans" class="answer">log(1,000) = 3</div></div><div class="caption" id="logcap">Start with the fact you already know.</div><div class="row"><button class="btn" onclick="logFlip()">Show next step</button></div></div>`}
let logFlipped=false;function logFlip(){logFlipped=!logFlipped;document.getElementById('pwr').classList.toggle('flip',logFlipped);document.getElementById('logans').classList.toggle('show',logFlipped);document.getElementById('logcap').textContent=logFlipped?'Same relationship. Now we are asking for the exponent.':'Start with the fact you already know.';if(logFlipped)setTimeout(()=>{state.targeted.stage='together';save();},500)}
function targetedTogether(){return `<div class="hero"><div class="kicker">Logs & Estimation</div><h1>Do one with me.</h1></div>${path('Do It With Me')}${teacher(`We know <b>10² = 100</b>. So if I write <b>log(100)</b>, I am asking for that exponent. What number belongs in the box?`)}<div class="card"><div class="eq">10² = 100 → log(100) = ?</div><input id="tans" class="input" inputmode="numeric" placeholder="Enter the exponent"><button class="btn" style="margin-top:10px" onclick="checkTogether()">Check with Dr. Merissa</button><div id="tfb"></div></div>`}
function checkTogether(){const v=document.getElementById('tans').value.trim();const fb=document.getElementById('tfb');if(v==='2'){fb.innerHTML='<div class="feedback good"><b>Exactly.</b> You did not learn a new fact. You read the same fact backward. 10² = 100, so log(100) = 2.</div><button class="btn good" style="margin-top:10px" onclick="setTargetStage(\'guided\')">Practice with support</button>'}else{fb.innerHTML='<div class="feedback info"><b>Look at the exponent in 10² = 100.</b> A log is asking you to name that exponent. Try again.</div>'}}
function targetedQuestions(label,start,end){const idx=Math.max(start,state.targeted.q);if(idx>=end){state.targeted.stage=label==='Guided Practice'?'alone':'fresh';state.targeted.q=0;save();return targeted()}const item=logQs[idx];const active=label==='Guided Practice'?'Guided Practice':'Try It Alone';return `<div class="hero"><div class="kicker">Logs & Estimation · ${idx-start+1} of ${end-start}</div><h1>${label}</h1></div>${path(active)}${label==='Guided Practice'?teacher(`Use the relationship first. For estimation items, your approved no-calculator references are <b>log(2)≈0.30, log(3)≈0.48, log(5)≈0.70</b>.`):teacher(`Now I am stepping back. Work it independently. I will still explain the mistake after you answer.`)}<div class="card"><div class="q">${item.q}</div><input id="qans" class="input" placeholder="Your answer"><button class="btn" style="margin-top:10px" onclick="checkTargetQ(${idx},${start},${end})">Check answer</button><button class="btn ghost" style="margin-top:8px" onclick="idkTarget(${idx})">I don't know yet</button><div id="qfb"></div></div>`}
function matches(v,item){const n=v.trim().toLowerCase();if(n===String(item.a).toLowerCase()||(item.alt||[]).some(x=>x.toLowerCase()===n))return true;if(item.tol!==undefined){const num=parseFloat(n);return Number.isFinite(num)&&Math.abs(num-parseFloat(item.a))<=item.tol}return false}
function checkTargetQ(idx,start,end){const item=logQs[idx],v=document.getElementById('qans').value,fb=document.getElementById('qfb');if(matches(v,item)){if(!state.targeted.seen.includes(item.id))state.targeted.seen.push(item.id);state.targeted.correct++;state.targeted.q=idx+1;save();fb.innerHTML=`<div class="feedback good"><b>Correct.</b> ${item.why}</div><button class="btn good" style="margin-top:10px" onclick="render()">Next question</button>`}else{fb.innerHTML=`<div class="feedback bad"><b>Not yet.</b> ${item.why}<br><br>Try the problem again using that relationship.</div>`}}
function idkTarget(idx){const item=logQs[idx];document.getElementById('qfb').innerHTML=`<div class="feedback info"><b>Let's change the representation.</b><br><br>Write the equivalent power-of-ten statement first. Then read the exponent. For this problem: ${item.why}</div>`}
function targetedFresh(){const unseen=logQs.find(x=>!state.targeted.seen.includes(x.id))||{q:'log(100,000) = ?',a:'5',why:'10⁵ = 100,000.'};return `<div class="hero"><div class="kicker">Logs & Estimation</div><h1>Fresh Check</h1><p>This is a fresh item, not the question you just practiced.</p></div>${path('Fresh Check')}${teacher(`No step-by-step prompt now. Show me what you understand.`)}<div class="card"><div class="q">${unseen.q}</div><input id="freshans" class="input"><button class="btn" style="margin-top:10px" onclick="checkFresh('${unseen.a}')">Check fresh answer</button><div id="freshfb"></div></div>`}
function checkFresh(a){const v=document.getElementById('freshans').value.trim();document.getElementById('freshfb').innerHTML=v===a?'<div class="feedback good"><b>Fresh check passed.</b> This single skill is complete for this preview. Day 1 itself is not complete because the other math areas and Chemistry still remain.</div><button class="btn good" style="margin-top:10px" onclick="goHome()">Return to classroom</button>':'<div class="feedback bad">Not yet. That means we return to teaching, not mark the skill complete.</div><button class="btn alt" style="margin-top:10px" onclick="setTargetStage(\'watch\')">Watch it another way</button>'}
function setTargetStage(x){state.targeted.stage=x;if(x==='guided')state.targeted.q=0;if(x==='alone')state.targeted.q=3;save();render()}

function foundation(){const f=state.foundation;if(f.stage==='teach')return foundationTeach();if(f.stage==='watch')return foundationWatch();return foundationPractice()}
function foundationTeach(){return `<div class="hero"><div class="kicker">Foundational Math Academy · Number Sense</div><h1>Learn to move numbers, not just stack them.</h1></div>${path('Teach')}${teacher(`A strong number sense lets you reshape a problem into an easier one without changing its value. Today we will solve <b>50 + 38</b> two different ways and compare the strategies.`)}<div class="card"><div class="eq">50 + 38</div><div class="caption">Before calculating, estimate: the answer should be close to 90.</div></div><div class="card"><button class="btn" onclick="setFoundation('watch')">Watch both strategies</button></div>`}
let fstep=0;function foundationWatch(){return `<div class="hero"><div class="kicker">Number Sense</div><h1>Watch compensation happen.</h1></div>${path('Watch')}${teacher(`We can make 38 easier by moving it to 40. But if we add 2 extra, we must remove that 2 later.`)}<div class="card"><div class="numberline"><div class="num">38</div><div class="num" id="f40">40</div><div class="num" id="f90">90</div><div class="num" id="f88">88</div></div><div class="caption" id="fcap">Start at 38. Tap through each move.</div><button class="btn" style="margin-top:12px" onclick="foundationStep()">Show next step</button></div>`}
function foundationStep(){fstep++;['f40','f90','f88'].forEach(id=>document.getElementById(id).classList.remove('active'));const cap=document.getElementById('fcap');if(fstep===1){document.getElementById('f40').classList.add('active');cap.textContent='Round 38 up to 40. We added 2 extra.'}else if(fstep===2){document.getElementById('f90').classList.add('active');cap.textContent='50 + 40 is easy: 90.'}else{document.getElementById('f88').classList.add('active');cap.textContent='Remove the extra 2: 90 - 2 = 88.';state.foundation.stage='practice';save()}}
function foundationPractice(){return `<div class="hero"><div class="kicker">Number Sense</div><h1>Choose a strategy, then explain it.</h1></div>${path('Do It With Me')}${teacher(`Try <b>60 + 29</b>. You can decompose 29 into 20 + 9, or compensate 29 up to 30 and subtract 1. Both are valid.`)}<div class="card"><div class="q">60 + 29 = ?</div><div class="choices"><button class="choice" onclick="foundationChoice(89,'comp')">Make 30, then subtract 1</button><button class="choice" onclick="foundationChoice(89,'decomp')">60 + 20 + 9</button><button class="choice" onclick="foundationChoice(91,'wrong')">60 + 30 + 1</button><button class="choice" onclick="foundationChoice(79,'wrong')">60 + 20 - 1</button></div><div id="ffb"></div></div>`}
function foundationChoice(ans,strategy){const fb=document.getElementById('ffb');if(ans===89){fb.innerHTML=`<div class="feedback good"><b>Yes, 89.</b> ${strategy==='comp'?'You used compensation: 29→30, 60+30=90, then 90-1=89.':'You decomposed 29 into 20 and 9: 60+20=80, then +9=89.'}<br><br>The point is not just the answer. You are learning to choose an efficient structure.</div><button class="btn good" style="margin-top:10px" onclick="goHome()">Save and return</button>`}else{fb.innerHTML='<div class="feedback info"><b>Check the adjustment.</b> If you change 29 to 30, you added 1 extra, so the final move must subtract 1.</div>'}}
function setFoundation(x){state.foundation.stage=x;save();render()}

function chem(){const c=state.chem;if(c.stage==='teach')return chemTeach();if(c.stage==='watch')return chemWatch();if(c.stage==='together')return chemTogether();return chemGuided()}
function chemTeach(){return `<div class="hero"><div class="kicker">Chemistry Foundation · Lewis Structures</div><h1>Electrons are the accounting system.</h1></div>${path('Teach')}${teacher(`<b>Before building anything, we count what we have.</b><br><br>For NH₃: nitrogen contributes 5 valence electrons. Three hydrogens contribute 3 more. Total = <b>8 electrons</b>.<br><br>Every single bond uses 2 electrons. After three N-H bonds, 6 electrons are used, leaving 2. Those last 2 become one lone pair on nitrogen.`)}<div class="card"><div class="eq">N: 5 + 3(H): 3 = 8 e⁻</div><div class="caption">Three bonds use 6 e⁻. Two e⁻ remain → one lone pair.</div></div><div class="card"><button class="btn" onclick="setChemStage('watch')">Watch NH₃ build itself</button></div>`}
function stageMarkup(){return `<div class="atomStage" id="astage"><div class="atom" id="n" style="left:calc(50% - 27px);top:110px">N</div><div class="atom" id="h1" style="left:calc(50% - 27px);top:22px">H</div><div class="atom" id="h2" style="left:80px;top:195px">H</div><div class="atom" id="h3" style="right:80px;top:195px">H</div><div class="bond" id="b1" style="left:50%;top:100px;width:58px;transform:rotate(-90deg)"></div><div class="bond" id="b2" style="left:calc(50% - 44px);top:168px;width:82px;transform:rotate(145deg)"></div><div class="bond" id="b3" style="left:calc(50% + 12px);top:168px;width:82px;transform:rotate(35deg)"></div><div class="pair" id="lp" style="left:calc(50% + 38px);top:105px">••</div></div><div class="counter"><div><b id="used">0</b><small>electrons used</small></div><div><b id="left">8</b><small>electrons remaining</small></div></div>`}
function chemWatch(){return `<div class="hero"><div class="kicker">NH₃ Watch</div><h1>Watch every electron get accounted for.</h1></div>${path('Watch')}${teacher(`I will build this one step at a time. Tap <b>Show next step</b>. Watch the molecule and the electron counter together.`)}<div class="card">${stageMarkup()}<div class="feedback info" id="chemcap">Step 1: We start with 8 total valence electrons.</div><button class="btn" style="margin-top:10px" onclick="nextChemWatch()">Show next step</button></div>`}
function syncChemVisual(){if(state.chem.stage!=='watch')return;for(let i=1;i<=state.chem.watchStep;i++)applyWatchVisual(i,true)}
function applyWatchVisual(step,silent){const show=id=>document.getElementById(id)&&document.getElementById(id).classList.add('show');const cap=document.getElementById('chemcap'),used=document.getElementById('used'),left=document.getElementById('left');if(step===1){show('n');if(cap&&!silent)cap.innerHTML='<b>Nitrogen goes in the center.</b> Hydrogen is not central in today\'s structures.'}if(step===2){show('h1');show('b1');if(used)used.textContent='2';if(left)left.textContent='6';if(cap&&!silent)cap.innerHTML='<b>First N-H bond.</b> One bond uses 2 electrons. 6 remain.'}if(step===3){show('h2');show('b2');if(used)used.textContent='4';if(left)left.textContent='4';if(cap&&!silent)cap.innerHTML='<b>Second N-H bond.</b> 4 electrons are now used. 4 remain.'}if(step===4){show('h3');show('b3');if(used)used.textContent='6';if(left)left.textContent='2';if(cap&&!silent)cap.innerHTML='<b>Third N-H bond.</b> 6 electrons are used. 2 remain.'}if(step===5){show('lp');if(used)used.textContent='8';if(left)left.textContent='0';if(cap&&!silent)cap.innerHTML='<b>The final 2 electrons become one lone pair on nitrogen.</b> All 8 electrons are now accounted for.'}}
function nextChemWatch(){if(state.chem.watchStep<5){state.chem.watchStep++;applyWatchVisual(state.chem.watchStep,false);save()}else{state.chem.stage='together';state.chem.togetherStep=0;save();render()}}
function chemTogether(){const step=state.chem.togetherStep;const instructions=['Tap N to choose nitrogen.','Place nitrogen in the center.','Add the first H.','Add the second H.','Add the third H.','Finish by placing the lone pair on nitrogen.'];return `<div class="hero"><div class="kicker">NH₃ Build Together</div><h1>Now you build it with me.</h1></div>${path('Do It With Me')}${teacher(`<b>${instructions[step]}</b><br><br>I will only ask for one action at a time. You are not being dropped into an unexplained empty workbench.`)}<div class="card"><div id="miniStage" class="atomStage"></div><div class="choices" style="margin-top:10px"><button class="choice" onclick="chemAction('N')">N</button><button class="choice" onclick="chemAction('H')">H</button><button class="choice" onclick="chemAction('O')">O</button><button class="choice" onclick="chemAction('pair')">Lone Pair</button></div><div id="cfb"></div><button class="btn ghost" style="margin-top:8px" onclick="skipChemTogether()">Skip for now and return to classroom</button></div>`}
function chemAction(action){const step=state.chem.togetherStep,expected=['N','N','H','H','H','pair'][step],fb=document.getElementById('cfb');if(action!==expected){fb.innerHTML=`<div class="feedback info"><b>Not that one yet.</b> ${step<2?'We are starting with nitrogen because NH₃ has one N and nitrogen is the central atom.':'Look at the current instruction above. We are adding the molecule one required piece at a time.'}</div>`;return}state.chem.togetherStep++;save();fb.innerHTML='<div class="feedback good"><b>Good move.</b> That action matches the structure and our electron plan.</div>';if(state.chem.togetherStep>=6){state.chem.stage='guided';save();setTimeout(render,500)}else setTimeout(render,500)}
function skipChemTogether(){state.chem.stage='together';state.screen='home';save();render()}
function chemGuided(){return `<div class="hero"><div class="kicker">Chemistry Guided Practice</div><h1>H₂O is next.</h1></div>${path('Guided Practice')}${teacher(`You have seen the pattern and built NH₃ with me. For H₂O, start by counting: oxygen gives 6 and two hydrogens give 2, so you have 8 total electrons. Two O-H bonds use 4. What should happen to the remaining 4?`)}<div class="card"><div class="q">Where do the remaining 4 electrons go?</div><div class="choices"><button class="choice" onclick="waterAnswer('two')">Two lone pairs on O</button><button class="choice" onclick="waterAnswer('h')">Two lone pairs on H</button><button class="choice" onclick="waterAnswer('bond')">Make another O-H bond</button><button class="choice" onclick="waterAnswer('discard')">They are unused</button></div><div id="wfb"></div><button class="btn ghost" style="margin-top:8px" onclick="goHome()">Save and switch subjects</button></div>`}
function waterAnswer(x){document.getElementById('wfb').innerHTML=x==='two'?'<div class="feedback good"><b>Exactly.</b> The 4 remaining electrons become two lone pairs on oxygen. Next in the full build, you would construct H₂O on an empty stage with guided hints available.</div>':'<div class="feedback info"><b>Recount.</b> Hydrogen only needs 2 electrons around it. Oxygen gets the remaining electrons as lone pairs after the two O-H bonds are formed.</div>'}
function setChemStage(x){state.chem.stage=x;save();render()}
render();
</script>
</body>
