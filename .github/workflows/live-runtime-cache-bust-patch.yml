name: Live Runtime Cache Bust Patch

on:
  push:
    branches: [ "fix/live-runtime-cache-bust" ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply content-addressed classroom cache token') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-runtime-cache-bust
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply content-addressed runtime token
        run: node scripts/apply-live-runtime-cache-bust.js
      - name: Run targeted regressions
        run: |
          node --check day1/classroom-v5.js
          node test-day1-classroom-v5.js
          node test-day1-mobile-interaction-stability.js
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add day1/index.html test-day1-classroom-v5.js
          git commit -m "Apply content-addressed classroom cache token"
          git push origin HEAD:fix/live-runtime-cache-bust
