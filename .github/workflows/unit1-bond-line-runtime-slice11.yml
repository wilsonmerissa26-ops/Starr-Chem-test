name: Unit 1 Bond-Line runtime Slice 11

on:
  pull_request:
    paths:
      - 'watch-mode.js'
      - 'build-together.js'
      - 'student-model-idk-router.js'
      - 'unit1-skill-registry.js'
      - 'course-units/unit1/bond-line/**'
      - 'test-build-together.js'
      - 'test-unit1-bond-line-runtime-slice*.js'
      - 'test-unit1-bond-line-slice*.js'
      - '.github/workflows/unit1-bond-line-runtime-slice11.yml'
  push:
    branches:
      - feature/unit1-bond-line-runtime-slice11
    paths:
      - 'watch-mode.js'
      - 'build-together.js'
      - 'student-model-idk-router.js'
      - 'unit1-skill-registry.js'
      - 'course-units/unit1/bond-line/**'
      - 'test-build-together.js'
      - 'test-unit1-bond-line-runtime-slice*.js'
      - 'test-unit1-bond-line-slice*.js'
      - '.github/workflows/unit1-bond-line-runtime-slice11.yml'

jobs:
  runtime-slice11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install DOM-test dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Shared Build Together parses
        run: node --check build-together.js
      - name: Existing Build Together contract
        run: node test-build-together.js
      - name: Browser app parses
        run: node --check course-units/unit1/bond-line/bond-line-app.js
      - name: Guided adapter parses
        run: node --check course-units/unit1/bond-line/bond-line-guided.js
      - name: Guided UI parses
        run: node --check course-units/unit1/bond-line/bond-line-guided-ui.js
      - name: Existing Watch Mode contract
        run: node test-watch-mode.js
      - name: Locked Slice 1 runtime contract
        run: node test-unit1-bond-line-runtime-slice1.js
      - name: Locked repair-focus behavior
        run: node test-unit1-bond-line-repair-focus.js
      - name: Locked Slice 2 runtime contract
        run: node test-unit1-bond-line-runtime-slice2.js
      - name: Locked Slice 2 visual emphasis
        run: node test-unit1-bond-line-slice2-visual-style.js
      - name: Locked Slice 2 review regressions
        run: node test-unit1-bond-line-slice2-review-regressions.js
      - name: Locked Slice 3 runtime contract
        run: node test-unit1-bond-line-runtime-slice3.js
      - name: Locked Slice 3 sequential fade and exact Pause
        run: node test-unit1-bond-line-slice3-fade-pause.js
      - name: Locked Slice 3 final review
        run: node test-unit1-bond-line-slice3-final-review.js
      - name: Locked Slice 4 runtime contract
        run: node test-unit1-bond-line-runtime-slice4.js
      - name: Locked Slice 4 visual contract
        run: node test-unit1-bond-line-slice4-collapse-pause.js
      - name: Locked Slice 4 review regressions
        run: node test-unit1-bond-line-slice4-codex-regressions.js
      - name: Locked Slice 4 motion re-arm
        run: node test-unit1-bond-line-slice4-motion-rearm.js
      - name: Locked Slice 4 geometry continuity
        run: node test-unit1-bond-line-slice4-geometry-continuity.js
      - name: Locked Slice 5 runtime contract
        run: node test-unit1-bond-line-runtime-slice5.js
      - name: Locked Slice 6 runtime contract
        run: node test-unit1-bond-line-runtime-slice6.js
      - name: Locked Slice 7 runtime contract
        run: node test-unit1-bond-line-runtime-slice7.js
      - name: Locked Slice 8 runtime contract
        run: node test-unit1-bond-line-runtime-slice8.js
      - name: Locked Slice 9 runtime contract
        run: node test-unit1-bond-line-runtime-slice9.js
      - name: Locked Slice 10 runtime contract
        run: node test-unit1-bond-line-runtime-slice10.js
      - name: Guided 2-methylbutane contract
        run: node test-unit1-bond-line-runtime-slice11.js
