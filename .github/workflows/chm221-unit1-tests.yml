name: CHM 221 Unit 1 Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install DOM-test dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Syntax-check Unit 1 data
        run: node --check course-units/unit1/unit1-data.js
      - name: Syntax-check Unit 1 support router
        run: node --check course-units/unit1/unit1-support.js
      - name: Syntax-check Unit 1 runtime
        run: node --check course-units/unit1/unit1-app.js
      - name: Syntax-check Chapter 1 teaching data
        run: node --check course-units/unit1/chapter1/chapter1-data.js
      - name: Syntax-check Chapter 1 teaching engine
        run: node --check course-units/unit1/chapter1/chapter1-engine.js
      - name: Syntax-check Chapter 1 evidence policy
        run: node --check course-units/unit1/chapter1/chapter1-policy.js
      - name: Syntax-check Chapter 1 IDK support
        run: node --check course-units/unit1/chapter1/chapter1-support.js && node --check course-units/unit1/chapter1/chapter1-support-hook.js && node --check course-units/unit1/chapter1/chapter1-supported-support.js
      - name: Syntax-check Chapter 1 learner runtime
        run: node --check course-units/unit1/chapter1/chapter1-app.js && node --check course-units/unit1/chapter1/chapter1-app-v2.js
      - name: Syntax-check Test 1 adaptive tutor
        run: node --check course-units/unit1/test1/test1-data.js && node --check course-units/unit1/test1/test1-support.js && node --check course-units/unit1/test1/test1-policy.js && node --check course-units/unit1/test1/test1-engine.js && node --check course-units/unit1/test1/test1-engine-production.js && node --check course-units/unit1/test1/test1-visuals.js && node --check course-units/unit1/test1/test1-production.js && node --check course-units/unit1/test1/test1-motion.js && node --check course-units/unit1/test1/test1-app-v2.js
      - name: Run CHM 221 Unit 1 behavioral regressions
        run: node test-chm221-unit1.js
      - name: Run Unit 1 IDK teaching regression
        run: node test-unit1-idk-teaching.js
      - name: Run Chapter 1 teaching engine regression
        run: node test-unit1-chapter1-teaching-engine.js
      - name: Run Chapter 1 six-way IDK routing regression
        run: node test-unit1-chapter1-idk-routing.js
      - name: Run Chapter 1 production evidence policy regression
        run: node test-unit1-chapter1-production-policy.js
      - name: Run real Chapter 1 learner page regression
        run: node test-unit1-chapter1-real-page.js
      - name: Run Chapter 1 learner entry regression
        run: node test-unit1-chapter1-entry.js
      - name: Run Test 1 chemistry accuracy regression
        run: node test-unit1-test1-chemistry.js
      - name: Run Test 1 bank coverage audit
        run: node test-unit1-test1-bank-coverage.js
      - name: Run Test 1 adaptive behavior regression
        run: node test-unit1-test1-adaptive.js
      - name: Run Test 1 production-practice regression
        run: node test-unit1-test1-production.js
      - name: Run Test 1 teaching motion regression
        run: node test-unit1-test1-motion.js
      - name: Run real Test 1 learner page regression
        run: node test-unit1-test1-real-page.js

  repair-ipad:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/test1-adaptive-tutor
          fetch-depth: 2
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install DOM-test dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Apply narrow iPad fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          motion=Path('course-units/unit1/test1/test1-motion.js')
          s=motion.read_text()
          old="obs.observe(host,{childList:true,subtree:true,characterData:true});"
          new="obs.observe(host,{childList:true});"
          assert old in s, 'expected broad observer not found'
          motion.write_text(s.replace(old,new,1))

          page=Path('course-units/unit1/test1/index.html')
          s=page.read_text()
          marker='@media(max-width:860px){'
          tablet='@media(max-width:1100px){.chem-svg .big{font-size:20px}.chem-svg .note{font-size:14px}.chem-svg .small{font-size:13px}}'
          assert marker in s, 'responsive marker not found'
          assert tablet not in s, 'tablet typography already present'
          page.write_text(s.replace(marker,tablet+marker,1))

          test=Path('test-unit1-test1-motion.js')
          s=test.read_text()
          assert "const assert=require('assert');" in s
          s=s.replace("const assert=require('assert');","const assert=require('assert'),fs=require('fs');",1)
          anchor="console.log('\\n'+passed+' Test 1 teaching-motion assertions passed.');"
          extra="""\nconst motionSource=fs.readFileSync('course-units/unit1/test1/test1-motion.js','utf8');\nok('motion observer watches only direct host replacement',motionSource.includes('obs.observe(host,{childList:true})')&&!motionSource.includes('obs.observe(host,{childList:true,subtree:true,characterData:true})'));\nconst pageSource=fs.readFileSync('course-units/unit1/test1/index.html','utf8');\nok('tablet chemistry visuals use reduced SVG typography',/@media\\(max-width:1100px\\)\\{\\.chem-svg \\.big\\{font-size:20px\\}\\.chem-svg \\.note\\{font-size:14px\\}\\.chem-svg \\.small\\{font-size:13px\\}\\}/.test(pageSource));\n"""
          assert anchor in s, 'motion test anchor not found'
          test.write_text(s.replace(anchor,extra+anchor,1))
          PY
      - name: Run focused motion regression
        run: node test-unit1-test1-motion.js
      - name: Run real Test 1 learner page regression
        run: node test-unit1-test1-real-page.js
      - name: Commit tested repair and restore workflow
        run: |
          git config user.name "wilsonmerissa26-ops"
          git config user.email "236429504+wilsonmerissa26-ops@users.noreply.github.com"
          git show HEAD^:.github/workflows/chm221-unit1-tests.yml > .github/workflows/chm221-unit1-tests.yml
          git rm -f .github/workflows/temp-pr96-ipad-fix.yml .pr96-ipad-repair-trigger
          git add .github/workflows/chm221-unit1-tests.yml course-units/unit1/test1/test1-motion.js course-units/unit1/test1/index.html test-unit1-test1-motion.js
          git commit -m "Fix Test 1 iPad motion performance and visual overflow"
          git push origin HEAD:feature/test1-adaptive-tutor
