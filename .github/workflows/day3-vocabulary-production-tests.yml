name: Day 3 Vocabulary Production Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  vocabulary-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check audited Day 3 vocabulary core
        run: node --check day3/vocab-production-v34.js
      - name: Syntax-check Day 3 vocabulary language correction
        run: node --check day3/vocab-production-v34-language-fix.js
      - name: Run Day 3 vocabulary production contract
        run: node test-day3-vocabulary-production.js
      - name: Run Day 3 vocabulary natural-language tests
        run: node test-day3-vocabulary-natural-language.js
      - name: Run Day 3 vocabulary red-team semantics and migration tests
        run: node test-day3-vocabulary-red-team-v34.js
