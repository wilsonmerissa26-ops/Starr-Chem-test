name: Day 1 Real Page Tests

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'day1/**'
      - 'day1-orchestrator.js'
      - 'math-gym-engine*.js'
      - 'molecule-stage.js'
      - 'semantic-answer-equivalence.js'
      - 'vocabulary-visual-learning-v1.js'
      - 'test-day1-real-page.js'
      - 'test-day1-observer-stability.js'
      - '.github/workflows/day1-real-page-tests.yml'
  workflow_dispatch:

jobs:
  day1-real-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install DOM-test dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Run real Day 1 learner page regression
        run: node test-day1-real-page.js
      - name: Run Day 1 observer stability regression
        run: node test-day1-observer-stability.js
