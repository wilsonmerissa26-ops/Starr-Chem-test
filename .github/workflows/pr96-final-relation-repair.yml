name: Temporary PR96 final relation repair
on:
  push:
    branches: [feature/test1-adaptive-tutor]
    paths: ['.github/workflows/pr96-final-relation-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/test1-adaptive-tutor
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply scoped structured-reasoning repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('course-units/unit1/test1/test1-engine.js')
          text = engine.read_text()
          old = r"var relation=/\b(same|different|identical|unchanged|greater|stronger|weaker|higher|lower|compact|branched|broad|strong|absent|present|far|near|close)\b/;function structured(splitter){var covered={},count=0;t.split(splitter).map(function(x){return x.trim();}).filter(Boolean).forEach(function(unit){var uids=ids(unit);if(uids.length&&(action.test(unit)||relation.test(unit))){count++;uids.forEach(function(i){covered[i]=true;});}});return count>=2&&Object.keys(covered).length===groups.length;}"
          new = r"var relation=/\b(?:has|have|shows?|contains?|features?|lacks?)\b[^;.!?]{0,60}\b(?:surface|contact|dispersion|london|o-h|oh|c=o|carbonyl|strain|energy|axial|equatorial|steric)\b|\b(?:is|are)\s+(?:more|less)\s+(?:compact|branched|stable|strained)\b/;function structured(splitter){var covered={},count=0;t.split(splitter).map(function(x){return x.trim();}).filter(Boolean).forEach(function(unit){var uids=ids(unit);if(uids.length&&(action.test(unit)||relation.test(unit))){count++;uids.forEach(function(i){covered[i]=true;});}});return count>=2&&Object.keys(covered).length===groups.length;}"
          if old not in text:
              raise SystemExit('expected explanation relation block not found')
          engine.write_text(text.replace(old, new, 1))

          test = Path('test-unit1-test1-adaptive.js')
          t = test.read_text()
          anchor = "let irReasoning=E.explanationGrade(D.lesson('functional-ir').explanation,'An alcohol has a broad O-H and no carbonyl; a ketone has a strong C=O and no broad O-H; a carboxylic acid has both broad O-H and strong carbonyl features.');\nok('Explain Why preserves valid IR pattern reasoning without copula-only credit',irReasoning.correct);"
          addition = anchor + "\nlet irPropertyNonsense=E.explanationGrade(D.lesson('functional-ir').explanation,'Alcohol o-h broad purple nonsense words; ketone acid carbonyl strong purple elephants.');\nok('Explain Why rejects isolated IR property words without a chemistry relationship',!irPropertyNonsense.correct);"
          if anchor not in t:
              raise SystemExit('expected IR regression anchor not found')
          test.write_text(t.replace(anchor, addition, 1))
          PY
      - name: Install DOM-test dependency
        run: npm install --no-save jsdom@22
      - name: Run focused Test 1 regressions
        run: |
          node test-unit1-test1-chemistry.js
          node test-unit1-test1-bank-coverage.js
          node test-unit1-test1-adaptive.js
          node test-unit1-test1-production.js
          node test-unit1-test1-real-page.js
      - name: Commit tested repair and remove runner
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr96-final-relation-repair.yml
          git add course-units/unit1/test1/test1-engine.js test-unit1-test1-adaptive.js
          git commit -m 'Require meaningful structured explanation relations'
          git push origin HEAD:feature/test1-adaptive-tutor
