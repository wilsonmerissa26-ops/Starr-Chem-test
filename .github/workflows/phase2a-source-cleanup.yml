name: Phase 2A Exact Source Cleanup

on:
  push:
    branches: [ "agent/phase2-adaptive-core-clean" ]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Apply exact dead-log cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2A branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-adaptive-core-clean
          fetch-depth: 0
      - name: Remove exact dead negative-log fallback
        run: node scripts/remove-dead-negative-log.js
      - name: Verify source cleanup
        run: |
          node --check day1-adaptive-math-model-core.js
          ! grep -F "p.family==='estimate_negative_log'" day1-adaptive-math-model-core.js
          ! grep -F "Math.log10(front)" day1-adaptive-math-model-core.js
      - name: Commit generated source cleanup
        run: |
          if git diff --quiet -- day1-adaptive-math-model-core.js; then
            echo "No source cleanup needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add day1-adaptive-math-model-core.js
          git commit -m "Apply exact dead-log cleanup"
          git push origin HEAD:agent/phase2-adaptive-core-clean
