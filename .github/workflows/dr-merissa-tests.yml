name: Dr Merissa Engine Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Student Model and IDK Router tests
        run: node test-student-model.js
      - name: Run Watch Mode tests
        run: node test-watch-mode.js
      - name: Run Build Together tests
        run: node test-build-together.js
      - name: Run integrated Day 1 session tests
        run: node test-day1-session.js
      - name: Run Day 1 learner acceptance tests
        run: node test-day1-acceptance.js
      - name: Run adversarial Day 1 learner tests
        run: node test-day1-adversarial.js
      - name: Run manual-certification repair regressions
        run: node test-day1-repair.js
      - name: Run adaptive practice and mastery tests
        run: node test-adaptive-mastery-engine.js
      - name: Run chemistry mastery progression tests
        run: node test-chemistry-mastery-progression.js
      - name: Syntax-check chemistry learner UI
        run: node --check chemistry-teacher-preview/chemistry-mastery-ui.js
      - name: Run chemistry mastery learner UI tests
        run: node test-chemistry-mastery-ui.js
      - name: Run notebook and review queue tests
        run: node test-notebook-review-queue.js
      - name: Syntax-check Math Gym engine
        run: node --check math-gym-engine.js
      - name: Run Math Gym engine tests
        run: node test-math-gym-engine.js
      - name: Syntax-check Day 1 orchestrator
        run: node --check day1-orchestrator.js
      - name: Run Day 1 orchestrator tests
        run: node test-day1-orchestrator.js
      - name: Syntax-check Day 1 v4 classroom
        run: node --check day1/classroom-v4.js
      - name: Run Day 1 v4 regression checks
        run: node test-day1-classroom-v4.js
      - name: Syntax-check Day 1 v5 classroom
        run: node --check day1/classroom-v5.js
      - name: Syntax-check chemistry teaching fixes
        run: node --check chemistry-teacher-preview/chemistry-teaching-fixes-v2.js
      - name: Run Day 1 v5 teaching-contract regressions
        run: node test-day1-classroom-v5.js
      - name: Syntax-check visible Math Gym UI
        run: node --check day1/math-gym-ui.js
      - name: Syntax-check chemistry talk-through tutor
        run: node --check chemistry-teacher-preview/chemistry-talkthrough.js
      - name: Run interactive chemistry talk-through tests
        run: node test-chemistry-talkthrough-v2.js
      - name: Syntax-check chemistry talk-through loader
        run: node --check day1/chemistry-talkthrough-loader.js
      - name: Syntax-check compact Toolbox UI
        run: node --check day1/toolbox-ui-v7.js
      - name: Run compact Toolbox contract tests
        run: node test-toolbox-ui-v7.js
      - name: Syntax-check step-by-step math problem coach
        run: node --check day1/math-problem-coach-v8.js
      - name: Run step-by-step math problem coach tests
        run: node test-math-problem-coach-v8.js
      - name: Syntax-check exact-problem math teacher
        run: node --check day1/math-exact-problem-teacher-v9.js
      - name: Run exact-problem math teacher tests
        run: node test-math-exact-problem-teacher-v9.js
      - name: Syntax-check progressive math lesson stepper
        run: node --check day1/math-lesson-stepper-v10.js
      - name: Run progressive math lesson stepper tests
        run: node test-math-lesson-stepper-v10.js
      - name: Syntax-check personalized learning record
        run: node --check day1/learning-record-v11.js
      - name: Run personalized learning record tests
        run: node test-learning-record-v11.js
      - name: Syntax-check same-problem guided tutor
        run: node --check day1/guided-problem-tutor-v13.js
      - name: Run same-problem guided tutor tests
        run: node test-guided-problem-tutor-v13.js
      - name: Run Day 1 release academic and voice audit
        run: node test-day1-release-audit.js
