name: CHM 221 Course Hub Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  course-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check course hub
        run: node --check course-hub/course-hub.js
      - name: Verify course hub status and syllabus routing
        run: node test-course-hub.js
      - name: Verify root opens course hub
        run: node test-root-day1-redirect.js
