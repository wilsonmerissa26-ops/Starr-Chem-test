name: Unit 1 Bond-Line runtime Slice 1

on:
  pull_request:
    paths:
      - 'watch-mode.js'
      - 'unit1-skill-registry.js'
      - 'course-units/unit1/bond-line/**'
      - 'test-unit1-bond-line-runtime-slice1.js'
      - 'test-unit1-bond-line-repair-focus.js'
      - 'test-fixtures/normalize-bond-line-prefocus-syntax.js'
      - '.github/workflows/unit1-bond-line-runtime-slice1.yml'
  push:
    branches:
      - feature/unit1-bond-line-runtime-slice1
    paths:
      - 'watch-mode.js'
      - 'unit1-skill-registry.js'
      - 'course-units/unit1/bond-line/**'
      - 'test-unit1-bond-line-runtime-slice1.js'
      - 'test-unit1-bond-line-repair-focus.js'
      - 'test-fixtures/normalize-bond-line-prefocus-syntax.js'
      - '.github/workflows/unit1-bond-line-runtime-slice1.yml'

jobs:
  runtime-slice1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install DOM-test dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Bond-Line browser app parses as JavaScript
        run: node --check course-units/unit1/bond-line/bond-line-app.js
      - name: Existing Watch Mode contract
        run: node test-watch-mode.js
      - name: Bond-Line runtime Slice 1 contract
        run: node test-unit1-bond-line-runtime-slice1.js
      - name: Prove ordinary regression is RED on pre-focus-fix behavior
        shell: bash
        run: |
          git show 6b6bc7c555e10b8377fc789d05095e56db8309b9:course-units/unit1/bond-line/bond-line-app.js > /tmp/bond-line-app-pre-fix.js
          node test-fixtures/normalize-bond-line-prefocus-syntax.js /tmp/bond-line-app-pre-fix.js
          node --check /tmp/bond-line-app-pre-fix.js
          set +e
          BOND_LINE_APP_PATH=/tmp/bond-line-app-pre-fix.js node test-unit1-bond-line-repair-focus.js
          red_status=$?
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo "ERROR: behavioral focus regression unexpectedly passed against the known pre-focus-fix behavior."
            exit 1
          fi
      - name: Require the exact historical focus failure set
        run: EXPECT_REPAIR_FOCUS_BUG=1 BOND_LINE_APP_PATH=/tmp/bond-line-app-pre-fix.js node test-unit1-bond-line-repair-focus.js
      - name: Prove repair-focus regression is GREEN on current app
        run: node test-unit1-bond-line-repair-focus.js
