name: Vocabulary Encounter Reset Tests

on:
  pull_request:
    paths:
      - 'day1/chemistry-vocabulary-production-v33.js'
      - 'day3/vocab-production-v34.js'
      - 'day3/vocab-escalation-v35.js'
      - 'test-vocabulary-encounter-reset.js'
      - '.github/workflows/vocabulary-encounter-reset-tests.yml'

jobs:
  encounter-reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check vocabulary runtimes
        run: |
          node --check day1/chemistry-vocabulary-production-v33.js
          node --check day3/vocab-production-v34.js
          node --check day3/vocab-escalation-v35.js
      - name: Run encounter reset red-team
        run: node test-vocabulary-encounter-reset.js
