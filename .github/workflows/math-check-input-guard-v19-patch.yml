name: Math Check Input Guard V19 Patch

on:
  push:
    branches: [ "fix/math-check-input-guard-v19" ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply v19 pointer click guard wiring') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/math-check-input-guard-v19
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply v19 wiring
        run: node scripts/apply-math-check-input-guard-v19.js
      - name: Run targeted regressions
        run: |
          node --check day1/math-check-input-guard-v19.js
          node test-day1-mobile-interaction-stability.js
          node test-day1-classroom-v5.js
      - name: Commit exact repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add day1/index.html test-day1-mobile-interaction-stability.js
          git commit -m "Apply v19 pointer click guard wiring"
          git push origin HEAD:fix/math-check-input-guard-v19
