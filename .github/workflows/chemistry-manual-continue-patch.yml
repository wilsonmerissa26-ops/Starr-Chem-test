name: Chemistry Manual Continue Patch

on:
  push:
    branches: [ "fix/chemistry-manual-continue" ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply chemistry manual continue fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/chemistry-manual-continue
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact repair
        run: node scripts/apply-chemistry-manual-continue.js
      - name: Verify targeted chemistry tests
        run: |
          node --check chemistry-teacher-preview/chemistry-mastery-ui.js
          node test-chemistry-mastery-ui.js
          node test-chemistry-mastery-progression.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chemistry-teacher-preview/chemistry-mastery-ui.js test-chemistry-mastery-ui.js
          git commit -m "Apply chemistry manual continue fix"
          git push origin HEAD:fix/chemistry-manual-continue
