name: Vocabulary Visual Learning Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  visual-learning:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check vocabulary visual layer
        run: node --check vocabulary-visual-learning-v1.js
      - name: Run vocabulary visual learning contract
        run: node test-vocabulary-visual-learning.js
