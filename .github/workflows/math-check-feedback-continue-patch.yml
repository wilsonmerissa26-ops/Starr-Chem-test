name: Math Check Feedback Continue Patch

on:
  push:
    branches: [ "fix/math-check-feedback-continue" ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply math check feedback Continue fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/math-check-feedback-continue
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact live math patch
        run: node scripts/apply-math-check-feedback-continue.js
      - name: Run targeted regressions
        run: |
          node --check day1/classroom-v5.js
          node test-day1-classroom-v5.js
          node test-day1-mobile-interaction-stability.js
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add day1/classroom-v5.js test-day1-classroom-v5.js
          git commit -m "Apply math check feedback Continue fix"
          git push origin HEAD:fix/math-check-feedback-continue
