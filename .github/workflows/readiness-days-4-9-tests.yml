name: Days 4-9 readiness tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  readiness-days-4-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test-readiness-days-4-9.js
      - run: node test-readiness-days-4-9-adversarial.js
      - run: node test-readiness-days-4-9-round-two.js
      - run: node test-readiness-days-4-9-final-compliance.js
      - run: node test-readiness-days-4-9-contract-gaps.js
      - run: node test-readiness-days-4-9-relationship-integrity.js
      - run: node test-readiness-days-4-9-print.js
