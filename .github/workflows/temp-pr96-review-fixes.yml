name: Temporary PR96 Review Fixes
on:
  push:
    branches:
      - feature/test1-adaptive-tutor
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/test1-adaptive-tutor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed fixes
        run: python .github/tmp-pr96-fix.py
      - name: Run focused regressions
        run: |
          node --check course-units/unit1/test1/test1-engine.js
          node --check course-units/unit1/test1/test1-engine-production.js
          node test-unit1-test1-adaptive.js
          node test-unit1-test1-bank-coverage.js
          node test-unit1-test1-production.js
          node test-unit1-test1-real-page.js
      - name: Commit fixes and remove temporary files
        run: |
          rm .github/workflows/temp-pr96-review-fixes.yml .github/tmp-pr96-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix PR96 tutoring review findings"
          git push origin HEAD:feature/test1-adaptive-tutor
