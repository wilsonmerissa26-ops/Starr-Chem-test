name: Live Toolbox Coach Patch

on:
  push:
    branches: [ "fix/live-chem-toolbox-coach-aliases" ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply live coach answer aliases') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-chem-toolbox-coach-aliases
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact coach matcher patch
        run: node scripts/apply-live-coach-answer-alias-fix.js
      - name: Run targeted live tests
        run: |
          node --check day1/toolbox-ui-v7.js
          node --check day1/math-problem-coach-v8.js
          node test-toolbox-ui-v7.js
          node test-math-problem-coach-v8.js
          node test-day1-mobile-interaction-stability.js
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add day1/math-problem-coach-v8.js test-math-problem-coach-v8.js
          git commit -m "Apply live coach answer aliases"
          git push origin HEAD:fix/live-chem-toolbox-coach-aliases
