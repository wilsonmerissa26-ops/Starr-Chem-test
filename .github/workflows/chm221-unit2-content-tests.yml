name: CHM 221 Unit 2 Content Tests

on:
  pull_request:
    paths:
      - 'course-units/unit2/**'
      - 'test-unit2-chapter5-content.js'
      - 'test-unit2-chapter5-visuals.js'
      - 'test-unit2-chapter5-support.js'
      - 'test-unit2-chapter5-engine-compatibility.js'
      - 'test-unit2-chapter5-scope-extension.js'
      - 'test-unit2-chapter5-real-page.js'
      - 'test-unit2-ch2-ch3-content.js'
      - 'test-unit2-ch2-ch3-engine-compatibility.js'
      - '.github/workflows/chm221-unit2-content-tests.yml'
  push:
    branches:
      - 'feature/unit2-chapter5-curriculum'
      - 'feature/unit2-adaptive-runtime'
      - 'feature/unit2-chapter5-learner'
      - 'feature/unit2-ch2-ch3-curriculum'
    paths:
      - 'course-units/unit2/**'
      - 'test-unit2-chapter5-content.js'
      - 'test-unit2-chapter5-visuals.js'
      - 'test-unit2-chapter5-support.js'
      - 'test-unit2-chapter5-engine-compatibility.js'
      - 'test-unit2-chapter5-scope-extension.js'
      - 'test-unit2-chapter5-real-page.js'
      - 'test-unit2-ch2-ch3-content.js'
      - 'test-unit2-ch2-ch3-engine-compatibility.js'
      - '.github/workflows/chm221-unit2-content-tests.yml'

jobs:
  unit2-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install DOM-test dependency
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Chapter 5 data parses
        run: node --check course-units/unit2/chapter5/chapter5-data.js
      - name: Chapter 5 scope data parses
        run: node --check course-units/unit2/chapter5/chapter5-scope-data.js
      - name: Chapter 5 visual data parses
        run: node --check course-units/unit2/chapter5/chapter5-visual-data.js
      - name: Chapter 5 scope visual data parses
        run: node --check course-units/unit2/chapter5/chapter5-scope-visual-data.js
      - name: Chapter 5 support parses
        run: node --check course-units/unit2/chapter5/chapter5-support.js
      - name: Chapter 5 scope support parses
        run: node --check course-units/unit2/chapter5/chapter5-scope-support.js
      - name: Chapter 5 engine bridge parses
        run: node --check course-units/unit2/chapter5/chapter5-engine-bridge.js
      - name: Chapter 5 learner app parses
        run: node --check course-units/unit2/chapter5/chapter5-app.js
      - name: Chapter 5 visual renderer parses
        run: node --check course-units/unit2/chapter5/chapter5-visuals.js
      - name: Chapter 2 resonance data parses
        run: node --check course-units/unit2/chapter2-resonance/chapter2-data.js
      - name: Chapter 2 evidence data parses
        run: node --check course-units/unit2/chapter2-resonance/chapter2-evidence-data.js
      - name: Chapter 2 resonance support parses
        run: node --check course-units/unit2/chapter2-resonance/chapter2-support.js
      - name: Chapter 2 resonance engine bridge parses
        run: node --check course-units/unit2/chapter2-resonance/chapter2-engine-bridge.js
      - name: Chapter 3 data parses
        run: node --check course-units/unit2/chapter3/chapter3-data.js
      - name: Chapter 3 evidence data parses
        run: node --check course-units/unit2/chapter3/chapter3-evidence-data.js
      - name: Chapter 3 support parses
        run: node --check course-units/unit2/chapter3/chapter3-support.js
      - name: Chapter 3 engine bridge parses
        run: node --check course-units/unit2/chapter3/chapter3-engine-bridge.js
      - name: Chapter 5 curriculum contract
        run: node test-unit2-chapter5-content.js
      - name: Chapter 5 visual contract
        run: node test-unit2-chapter5-visuals.js
      - name: Chapter 5 support-routing contract
        run: node test-unit2-chapter5-support.js
      - name: Chapter 5 locked-engine compatibility
        run: node test-unit2-chapter5-engine-compatibility.js
      - name: Chapter 5 current-edition scope extension
        run: node test-unit2-chapter5-scope-extension.js
      - name: Chapter 5 real learner page
        run: node test-unit2-chapter5-real-page.js
      - name: Chapter 2 and 3 curriculum contract
        run: node test-unit2-ch2-ch3-content.js
      - name: Chapter 2 and 3 locked-engine compatibility
        run: node test-unit2-ch2-ch3-engine-compatibility.js
