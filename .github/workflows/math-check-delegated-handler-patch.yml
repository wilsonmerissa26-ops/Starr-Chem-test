name: Math Check Delegated Handler Patch

on:
  push:
    branches: [ "fix/math-check-delegated-handler-2" ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply delegated math Check handler') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/math-check-delegated-handler-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply delegated Check handler
        run: node scripts/apply-math-check-delegated-handler.js
      - name: Run targeted regressions
        run: |
          node --check day1/classroom-v5.js
          node test-day1-classroom-v5.js
          node test-day1-mobile-interaction-stability.js
      - name: Commit exact repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add day1/classroom-v5.js day1/index.html test-day1-classroom-v5.js
          git commit -m "Apply delegated math Check handler"
          git push origin HEAD:fix/math-check-delegated-handler-2
