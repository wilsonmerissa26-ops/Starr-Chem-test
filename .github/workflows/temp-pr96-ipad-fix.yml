name: Temporary PR96 iPad Repair

on:
  push:
    branches: [ "feature/test1-adaptive-tutor" ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/test1-adaptive-tutor
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JSDOM
        run: npm install --no-save --no-package-lock jsdom@24.1.3
      - name: Apply narrow iPad fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          motion=Path('course-units/unit1/test1/test1-motion.js')
          s=motion.read_text()
          old="obs.observe(host,{childList:true,subtree:true,characterData:true});"
          new="obs.observe(host,{childList:true});"
          assert old in s, 'expected broad observer not found'
          motion.write_text(s.replace(old,new,1))

          page=Path('course-units/unit1/test1/index.html')
          s=page.read_text()
          marker='@media(max-width:860px){'
          tablet='@media(max-width:1100px){.chem-svg .big{font-size:20px}.chem-svg .note{font-size:14px}.chem-svg .small{font-size:13px}}'
          assert marker in s, 'responsive marker not found'
          assert tablet not in s, 'tablet typography already present'
          page.write_text(s.replace(marker,tablet+marker,1))

          test=Path('test-unit1-test1-motion.js')
          s=test.read_text()
          assert "const assert=require('assert');" in s
          s=s.replace("const assert=require('assert');","const assert=require('assert'),fs=require('fs');",1)
          anchor="console.log('\\n'+passed+' Test 1 teaching-motion assertions passed.');"
          extra="""\nconst motionSource=fs.readFileSync('course-units/unit1/test1/test1-motion.js','utf8');\nok('motion observer watches only direct host replacement',motionSource.includes('obs.observe(host,{childList:true})')&&!motionSource.includes('obs.observe(host,{childList:true,subtree:true,characterData:true})'));\nconst pageSource=fs.readFileSync('course-units/unit1/test1/index.html','utf8');\nok('tablet chemistry visuals use reduced SVG typography',/@media\\(max-width:1100px\\)\\{\\.chem-svg \\.big\\{font-size:20px\\}\\.chem-svg \\.note\\{font-size:14px\\}\\.chem-svg \\.small\\{font-size:13px\\}\\}/.test(pageSource));\n"""
          assert anchor in s, 'motion test anchor not found'
          s=s.replace(anchor,extra+anchor,1)
          test.write_text(s)
          PY
      - name: Run focused Test 1 motion regression
        run: node test-unit1-test1-motion.js
      - name: Run real Test 1 learner page regression
        run: node test-unit1-test1-real-page.js
      - name: Commit tested repair and remove temporary workflow
        run: |
          git config user.name "wilsonmerissa26-ops"
          git config user.email "236429504+wilsonmerissa26-ops@users.noreply.github.com"
          git rm .github/workflows/temp-pr96-ipad-fix.yml
          git add course-units/unit1/test1/test1-motion.js course-units/unit1/test1/index.html test-unit1-test1-motion.js
          git commit -m "Fix Test 1 iPad motion performance and visual overflow"
          git push origin HEAD:feature/test1-adaptive-tutor
