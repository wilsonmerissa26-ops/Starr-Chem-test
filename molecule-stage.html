<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>Molecule Stage — Build Mode</title>
<style>
:root{--paper:#eef1f0;--panel:#fff;--ink:#16232b;--soft:#4a5d66;--rule:#c9d3d1;--good:#2e7d6b;--warn:#c9a227}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,sans-serif}.wrap{max-width:640px;margin:auto;padding:16px 14px 80px}.eyebrow{font:11px monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}h1{font-size:22px}.tray,.tools{display:flex;gap:8px;margin:10px 0}.tray button,.tools button{flex:1;min-height:48px;border:1px solid var(--rule);border-radius:8px;background:#fff}.active{background:var(--good)!important;color:#fff}.stage{height:340px;background:#fff;border:1px solid var(--rule);border-radius:8px;width:100%;touch-action:manipulation}.feedback,.counter{display:none;padding:12px;margin:10px 0;border:1px solid var(--rule);border-radius:8px;background:#fff}.show{display:block}.warn{border-color:var(--warn)}.good{border-color:var(--good)}.go{width:100%;min-height:52px;border:0;border-radius:8px;background:var(--ink);color:#fff}.counter.show{display:flex;justify-content:space-around;text-align:center}.counter b{display:block;font:20px monospace}
</style>
</head>
<body><main class="wrap"><div class="eyebrow" id="modeLabel"></div><h1 id="prompt"></h1><p id="sub"></p><div id="counter" class="counter"></div><div id="tray" class="tray"></div><svg id="stage" class="stage" viewBox="0 0 400 340"></svg><div class="tools"><button id="lp">Lone Pair</button><button id="undo">Undo</button><button id="reset">Reset</button><button id="hint">Hint</button></div><div id="feedback" class="feedback"></div><button id="check" class="go">Check my structure</button></main>
<script src="molecule-stage.js"></script>
<script>
(function(){
 var q=new URLSearchParams(location.search),key=q.get('m')||'H2O',mode=q.get('mode')||'independent',target=MoleculeStageLogic.TARGETS[key]||MoleculeStageLogic.TARGETS.H2O;
 var state=MoleculeStageLogic.emptyState(),history=[],selected=null,pending=null,lp=false,id=0,revealed=false,svg=document.getElementById('stage'),NS='http://www.w3.org/2000/svg';
 document.getElementById('modeLabel').textContent=mode==='mastery'?'Fresh mastery check':'Independent practice';document.getElementById('prompt').textContent='Draw the complete Lewis structure for '+target.formula+'.';document.getElementById('sub').textContent='Tap an atom, then the stage. Tap two atoms to bond. Select Lone Pair, then tap an atom.';
 if(mode==='mastery'){document.getElementById('hint').remove();document.getElementById('counter').remove();}
 ['C','N','O','H'].forEach(function(el){var b=document.createElement('button');b.textContent=el;b.onclick=function(){pending=pending===el?null:el;lp=false;paintTools();};document.getElementById('tray').appendChild(b);});
 function next(){return 'a'+id++;}function clone(){return MoleculeStageLogic.cloneState(state);}function save(){if(mode!=='mastery')localStorage.setItem('molstage-'+key+'-'+mode,JSON.stringify({state:state,id:id}));}function push(){history.push(clone());}
 function paintTools(){Array.from(document.getElementById('tray').children).forEach(function(b){b.classList.toggle('active',b.textContent===pending);});document.getElementById('lp').classList.toggle('active',lp);}
 document.getElementById('lp').onclick=function(){lp=!lp;pending=null;paintTools();};document.getElementById('undo').onclick=function(){if(history.length){state=history.pop();save();render();}};document.getElementById('reset').onclick=function(){if(state.atoms.length&&confirm('Clear the whole structure?')){push();state=MoleculeStageLogic.emptyState();save();render();}};if(mode!=='mastery')document.getElementById('hint').onclick=function(){revealed=true;renderCounter();};
 function point(e){var r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*400,y:(e.clientY-r.top)/r.height*340};}function hit(p){return state.atoms.find(function(a){return Math.hypot(a.x-p.x,a.y-p.y)<34;});}
 svg.addEventListener('pointerup',function(e){e.preventDefault();var p=point(e),h=hit(p);if(lp&&h){push();state.lonePairs.push({id:next(),atomId:h.id});}else if(pending&&!h){push();state.atoms.push({id:next(),el:pending,x:p.x,y:p.y});pending=null;}else if(h&&!selected)selected=h.id;else if(h&&selected!==h.id){if(!state.bonds.some(function(b){return(b.a===selected&&b.b===h.id)||(b.b===selected&&b.a===h.id);})){push();state.bonds.push({id:next(),a:selected,b:h.id});}selected=null;}save();paintTools();render();});
 document.getElementById('check').onclick=function(){var f=document.getElementById('feedback'),mis=MoleculeStageLogic.detectMisconception(state,target),v=mis?null:MoleculeStageLogic.verifyStructure(state,target);f.className='feedback show '+(!mis&&v.correct?'good':'warn');f.innerHTML=!mis&&v.correct?'Correct. Every atom, bond, and lone pair is accounted for.':(mis?mis.message:'Keep your correct work. Compare the atom count, connections, and lone pairs with the formula.');if(mis||!v.correct)f.innerHTML+='<p><button id="ack">Okay — let me correct it</button></p>';if(document.getElementById('ack'))document.getElementById('ack').onclick=function(){f.className='feedback';};};
 function se(tag,a){var x=document.createElementNS(NS,tag);Object.keys(a).forEach(function(k){x.setAttribute(k,a[k]);});return x;}function renderCounter(){var c=document.getElementById('counter');if(!c)return;if(!revealed){c.className='counter';return;}var placed=MoleculeStageLogic.electronsPlaced(state);c.className='counter show';c.innerHTML='<span><b>'+target.totalElectrons+'</b>Total</span><span><b>'+placed+'</b>Placed</span><span><b>'+(target.totalElectrons-placed)+'</b>Remaining</span>';}
 function render(){svg.innerHTML='';state.bonds.forEach(function(b){var a=state.atoms.find(function(x){return x.id===b.a;}),z=state.atoms.find(function(x){return x.id===b.b;});svg.appendChild(se('line',{x1:a.x,y1:a.y,x2:z.x,y2:z.y,stroke:'#16232b','stroke-width':3}));});state.atoms.forEach(function(a){var g=se('g',{}),c=se('circle',{cx:a.x,cy:a.y,r:26,fill:'#fff',stroke:selected===a.id?'#2e7d6b':'#c9d3d1','stroke-width':2}),t=se('text',{x:a.x,y:a.y+6,'text-anchor':'middle','font-size':20});t.textContent=a.el;g.appendChild(c);g.appendChild(t);svg.appendChild(g);var n=MoleculeStageLogic.lonePairCountOf(state,a.id);for(var i=0;i<n;i++){svg.appendChild(se('text',{x:a.x+32,y:a.y-18+i*15,'font-size':18})).textContent=':';}});renderCounter();}
 try{var raw=localStorage.getItem('molstage-'+key+'-'+mode),d=raw&&JSON.parse(raw);if(d&&MoleculeStageLogic.validState(d.state)){state=d.state;id=d.id||0;}}catch(e){}render();
})();
</script></body></html>
