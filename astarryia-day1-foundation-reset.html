<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>Day 1 — Foundation Reset</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
:root{
  --paper:#EEF1F0;--panel:#FFFFFF;--ink:#16232B;--soft:#4A5D66;
  --rule:#C9D3D1;--rulesoft:#DFE6E4;--good:#2E7D6B;
  --good2:#6BA292;--warn:#C9A227;--bad:#B5533C;--dark:#111C22;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit}
button{cursor:pointer}
.shell{max-width:760px;margin:0 auto;padding:0 14px 90px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(238,241,240,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.topin{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.badge{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-family:'IBM Plex Mono',monospace}
.brandtxt{min-width:0}
.brandtxt b{display:block;font-size:14px}
.brandtxt span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:3px;background:var(--rulesoft)}
.progress>div{height:3px;background:var(--good);width:0;transition:width .25s}
.save{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--soft);white-space:nowrap}
.menuBtn{min-height:40px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);padding:8px 11px;font-weight:600}
.learningPath{display:flex;gap:5px;overflow-x:auto;margin:8px 0 14px;padding-bottom:3px}.learningPath span{flex:0 0 auto;padding:5px 8px;border:1px solid var(--rule);border-radius:999px;font-size:11px;color:var(--soft)}.learningPath .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{padding:22px 0 12px}
.eyebrow,.kicker{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.13em;font-size:10.5px;color:var(--soft)}
h1{font-size:30px;line-height:1.08;margin:6px 0 8px;letter-spacing:-.02em}
h2{font-size:24px;line-height:1.15;margin:4px 0 8px}
h3{font-size:18px;margin:4px 0 8px}
.lede{font-size:16.5px;color:var(--soft);line-height:1.55;margin:0}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px;margin:12px 0}
.rulebox{border-left:4px solid var(--warn);padding:10px 12px;background:#FCF8ED;border-radius:6px;margin:12px 0;color:#664f10}
.goodbox{border-left:4px solid var(--good);padding:10px 12px;background:#EDF6F3;border-radius:6px;margin:12px 0;color:#214e43}
.badbox{border-left:4px solid var(--bad);padding:10px 12px;background:#FBF0ED;border-radius:6px;margin:12px 0;color:#7b3427}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;min-height:48px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:11px 14px;font-weight:600}
.btn.alt{background:#fff;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--soft);border-color:var(--rule)}
.btn.small{width:auto;min-height:42px;padding:9px 13px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.option{width:100%;text-align:left;padding:12px;border-radius:8px;border:1px solid var(--rulesoft);background:#fff;margin:6px 0;color:var(--ink)}
.option.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.input{width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:8px;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:16px}
.answerTarget{display:flex;align-items:center;gap:10px;font:600 19px 'IBM Plex Mono',monospace;margin-bottom:8px}
.equation{font-size:clamp(18px,5vw,24px);overflow-x:auto;margin-top:12px}
sup{font-size:.7em;line-height:0}
.ta{width:100%;min-height:100px;padding:12px 13px;border:1px solid var(--rule);border-radius:8px;background:#fff;resize:vertical;line-height:1.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--soft)}
.mono{font-family:'IBM Plex Mono',monospace}
.pill{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:4px 8px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.pill.good{border-color:var(--good);color:var(--good)}
.pill.warn{border-color:var(--warn);color:#82670f}
.mathstatus{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.skill{border:1px solid var(--rulesoft);border-radius:8px;padding:10px}
.skill b{display:block;font-size:13px}
.skill span{font-size:11px;color:var(--soft)}
.teacher{display:flex;gap:12px;align-items:flex-start}
.avatar{width:62px;height:62px;border-radius:14px;background:linear-gradient(145deg,#202b32,#10171b);color:#fff;display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.bubble{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:13px;line-height:1.55;flex:1}
.whiteboard{background:#FDFEFE;border:1px solid var(--rule);border-radius:10px;padding:14px;font-family:'IBM Plex Mono',monospace;line-height:1.65;white-space:pre-wrap}
.stageWrap{background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin:10px 0}
svg#stage{display:block;width:100%;height:340px;touch-action:none}
.tray{display:flex;gap:8px;margin:8px 0}
.tray button{flex:1;min-height:52px;border-radius:8px;border:2px solid var(--rule);background:#fff;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600}
.tray button.active{background:var(--good);border-color:var(--good);color:#fff}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools button{min-height:44px;border:1px solid var(--rule);background:#fff;border-radius:8px}
.tools button.active{background:var(--good);color:#fff;border-color:var(--good)}
.counter{display:flex;justify-content:space-around;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:8px;margin:8px 0}
.counter .c{text-align:center;flex:1}
.counter .n{font-size:19px;font-family:'IBM Plex Mono',monospace;font-weight:600}
.counter .l{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
.hiddenCounter{display:block;text-align:center;color:var(--soft);font-size:12px}
.feedback{margin-top:10px;padding:11px 12px;border-radius:8px;display:none}
.feedback.show{display:block}
.feedback.good{background:#EAF4F1;border:1px solid var(--good);color:#1d5346}
.feedback.warn{background:#FBF6E8;border:1px solid var(--warn);color:#72590e}
.feedback.info{background:#F5F7F7;border:1px solid var(--rule);color:var(--soft)}
.sectionnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.sectionnav .btn{width:auto}
.term{border-bottom:1px dashed var(--soft);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(10,16,20,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.show{display:flex}
.modalCard{max-width:520px;width:100%;background:#fff;border-radius:14px;padding:18px}
.modalCard h3{margin-top:0}
.modalCard .showme{background:#F5F7F7;border:1px solid var(--rule);border-radius:8px;padding:12px;margin-top:10px}
.modeTabs{display:flex;gap:8px;margin-bottom:10px}
.modeTabs button{flex:1;min-height:42px;border:1px solid var(--rule);background:#fff;border-radius:8px}
.modeTabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:540px){
  .grid2,.mathstatus{grid-template-columns:1fr}
  .tools{grid-template-columns:repeat(2,1fr)}
  h1{font-size:26px}
}
</style>
</head>

</div>

<div class="shell">

    <p id="termPlain"></p>
    <div class="showme" id="termShow"></div>

</div>

<script>

    id:"fractions", name:"Fractions & percentages",

function normalize(s){
  return String(s||"").toLowerCase().replace(/\s+/g,"").replace(/−/g,"-").replace(/×/g,"x");

function isCorrect(ans,item){
  const n=normalize(ans);
  if(item.tol!==undefined){
    const v=parseFloat(String(ans).replace(/[^\d\.\-]/g,""));
    const target=parseFloat(item.a[0]);
    return Number.isFinite(v) && Math.abs(v-target)<=item.tol;
  }

}

    s.innerHTML=`

      <div class="goodbox">The next structure has no hints and no electron counter. This is not one you built earlier today.</div>

function mountMoleculeStage(key,mode,onSolved){
  const target=TARGETS[key];
  const scaffolded=mode==="guided"||mode==="together";
  const mount=document.getElementById("molMount");
  mount.innerHTML=`
    <div class="card">
      ${scaffolded?'<div class="counter" id="counter"></div>':''}
      ${mode==='together'?'<div class="rulebox" id="togetherPrompt"></div>':''}
      <div class="tray" id="atomTray"></div>
      <div class="stageWrap"><svg id="stage" viewBox="0 0 400 340"></svg></div>
      <div class="tools">
        <button id="lpTool">Lone Pair</button>
        <button id="undoBtn">Undo</button>
        <button id="resetBtn">Reset</button>
        ${scaffolded?'<button id="hintBtn">Hint</button>':''}
      </div>
      <div id="molHint" class="feedback info"></div>
      <div id="molFb" class="feedback"></div>
      <button class="btn" id="checkMol">Check my structure</button>
      ${mode==='mastery'?'':'<button class="btn ghost" id="skipMol">Skip for now</button>'}
    </div>
  `;

  const resumable=app.activeStage&&app.activeStage.key===key&&app.activeStage.mode===mode&&MoleculeStageLogic.validState(app.activeStage.state);
  let state=resumable?app.activeStage.state:{atoms:[],bonds:[],lonePairs:[]};
  let history=[],pendingEl=null,lpMode=false,selected=null,hintTier=0,counterShown=false;
  // Continue above persisted ids; restarting at a0 corrupts a resumed drawing.
  let id=state.atoms.concat(state.bonds,state.lonePairs).reduce((highest,item)=>{
    const match=String(item.id||'').match(/^a(\d+)$/);return match?Math.max(highest,Number(match[1])+1):highest;
  },0);
  const btPlan=mode==='together'?BuildTogether.BUILD_PLANS.NH3:null;
  let bt=btPlan?(app.activeStage&&app.activeStage.key===key&&app.activeStage.mode===mode&&app.activeStage.bt?app.activeStage.bt:BuildTogether.begin(BuildTogether.createBuildTogetherSession(btPlan),btPlan,Date.now())):null;
  const svg=document.getElementById("stage"), NS="http://www.w3.org/2000/svg", R=26;
  const nextId=()=> "a"+(id++);

  function clone(o){return JSON.parse(JSON.stringify(o))}
  function persistStage(){app.activeStage={key,mode,state:clone(state),bt:bt?clone(bt):null};saveApp()}
  function push(){history.push(clone(state));if(history.length>60)history.shift();}
  function loneCount(aid){return state.lonePairs.filter(x=>x.atomId===aid).length}
  function neighbors(aid){
    let out=[];state.bonds.forEach(b=>{if(b.a===aid)out.push(b.b);if(b.b===aid)out.push(b.a)});return out;
  }
  function eAround(aid){return neighbors(aid).length*2+loneCount(aid)*2}
  function sigs(){
    return state.atoms.map(a=>({
      el:a.el,lonePairs:loneCount(a.id),
      neighbors:neighbors(a.id).map(n=>state.atoms.find(x=>x.id===n)?.el||"?").sort()
    }));
  }
  function sigKey(x){return x.el+":"+x.neighbors.join(",")+":"+x.lonePairs}
  function verify(){
    return MoleculeStageLogic.verifyStructure(state,target).correct;
  }
  function detect(){
    const found=MoleculeStageLogic.detectMisconception(state,target);
    return found&&found.message;
  }
  function togetherAction(action){
    if(!bt)return true;
    const result=BuildTogether.submitAction(bt,btPlan,action,Date.now());
    if(!result.correct){showWrong(result.feedback);return false;}
    const f=document.getElementById('molFb');f.className='feedback show good';f.innerHTML=result.feedback+'<div style="margin-top:10px"><button class="btn small" id="btAck">Continue</button></div>';
    [...mount.querySelectorAll('button')].forEach(b=>{if(b.id!=='btAck')b.disabled=true});
    document.getElementById('btAck').onclick=()=>{f.className='feedback';[...mount.querySelectorAll('button')].forEach(b=>b.disabled=false);renderTogetherPrompt();};
    return true;
  }
  function renderTogetherPrompt(){const el=document.getElementById('togetherPrompt');if(el)el.textContent=bt.completed?'Structure complete. Check the finished molecule.':BuildTogether.currentPrompt(bt,btPlan);}

  ["C","N","O","H"].forEach(el=>{
    const b=document.createElement("button");b.textContent=el;b.dataset.el=el;
    b.onclick=()=>{pendingEl=pendingEl===el?null:el;lpMode=false;selected=null;renderTray();};
    document.getElementById("atomTray").appendChild(b);
  });
  function renderTray(){
    [...document.getElementById("atomTray").children].forEach(b=>b.classList.toggle("active",b.dataset.el===pendingEl));
    document.getElementById("lpTool").classList.toggle("active",lpMode);
  }
  document.getElementById("lpTool").onclick=()=>{lpMode=!lpMode;pendingEl=null;selected=null;renderTray();};
  document.getElementById("undoBtn").onclick=()=>{if(!history.length)return;state=history.pop();persistStage();renderStage();};
  document.getElementById("resetBtn").onclick=()=>{if(!state.atoms.length)return;if(confirm("Clear the whole structure?")){push();state={atoms:[],bonds:[],lonePairs:[]};selected=null;persistStage();renderStage();}};
  if(scaffolded) document.getElementById("hintBtn").onclick=()=>{
    hintTier=Math.min(3,hintTier+1);
    const h=[
      "Start with the total valence-electron count for the whole formula.",
      "Count the electrons already shown in bonds and lone pairs. Which atom is still short?",
      "The electron-accounting counter is now visible. Use it to check, not to guess."
    ][hintTier-1];
    const f=document.getElementById("molHint");f.className="feedback show info";f.textContent=h;
    if(hintTier>=3)counterShown=true;renderCounter();
  };
  document.getElementById("checkMol").onclick=()=>{
    const msg=detect();
    const f=document.getElementById("molFb");
    if(msg){showWrong(msg);return;}
    if(verify()){f.className="feedback show good";f.innerHTML='Correct. Every atom, bond, and lone pair matches the electron count.<div style="margin-top:10px"><button class="btn small" id="molContinue">Continue</button></div>';[...mount.querySelectorAll('button')].forEach(b=>{if(b.id!=="molContinue")b.disabled=true});document.getElementById('molContinue').onclick=()=>{app.activeStage=null;onSolved()};}
    else{showWrong(state.atoms.length!==target.atoms.length?"The atom count does not match the formula yet. Keep the atoms you placed correctly and compare each element with the formula.":"The atoms are present, but at least one connection or lone-pair count differs. Keep your correct work, count around each atom, and correct only the part that does not satisfy the formula.");}
  };
  if(mode!=='mastery')document.getElementById('skipMol').onclick=()=>{
    app.misconceptionLog['skipped:'+key]=(app.misconceptionLog['skipped:'+key]||0)+1;
    const f=document.getElementById('molFb');f.className='feedback show info';f.innerHTML='Skipped. This one gets logged as unresolved and does not count as complete.<div style="margin-top:10px"><button class="btn small" id="skipAck">Okay — keep working here</button></div>';
    document.getElementById('skipAck').onclick=()=>{f.className='feedback'};saveApp();
  };
  function showWrong(message){
    const f=document.getElementById("molFb");f.className="feedback show warn";
    f.innerHTML=message+'<div style="margin-top:10px"><button class="btn small" id="molAck">Okay — let me correct it</button></div>';
    [...mount.querySelectorAll('button')].forEach(b=>{if(b.id!=="molAck")b.disabled=true});
    document.getElementById('molAck').onclick=()=>{f.className='feedback';[...mount.querySelectorAll('button')].forEach(b=>b.disabled=false);document.getElementById('undoBtn').disabled=!history.length};
  }

  function renderCounter(){
    const c=document.getElementById("counter");
    if(!c)return;
    if(!counterShown){c.innerHTML='<span class="hiddenCounter">Counter hidden. Hint 3 can reveal it.</span>';return;}
    const placed=state.bonds.length*2+state.lonePairs.length*2;
    c.innerHTML=`
      <div class="c"><div class="n">${target.totalElectrons}</div><div class="l">Target total</div></div>
      <div class="c"><div class="n">${placed}</div><div class="l">Placed</div></div>
      <div class="c"><div class="n">${target.totalElectrons-placed}</div><div class="l">Remaining</div></div>`;
  }
  function pt(evt){
    const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
    return {x:(evt.clientX-r.left)/r.width*vb.width,y:(evt.clientY-r.top)/r.height*vb.height};
  }
  function hit(x,y){
    let best=null,d0=1e9;
    state.atoms.forEach(a=>{const d=Math.hypot(a.x-x,a.y-y);if(d<R+8&&d<d0){best=a;d0=d}});
    return best;
  }
  svg.addEventListener("pointerup",evt=>{
    evt.preventDefault();
    const p=pt(evt),h=hit(p.x,p.y);
    if(lpMode){
      if(h){if(!togetherAction({atom:h.label||h.el,count:1}))return;push();if(loneCount(h.id)>=3){const i=state.lonePairs.map(x=>x.atomId).lastIndexOf(h.id);state.lonePairs.splice(i,1)}else state.lonePairs.push({id:nextId(),atomId:h.id});persistStage();renderStage();}
      return;
    }
    if(pendingEl){
      if(h)return;
      if(!togetherAction({element:pendingEl}))return;
      push();const placedEl=pendingEl,ordinal=state.atoms.filter(a=>a.el===placedEl).length+1,label=placedEl==="H"?"H"+ordinal:placedEl;state.atoms.push({id:nextId(),el:placedEl,label,x:p.x,y:p.y});pendingEl=null;persistStage();renderTray();renderStage();return;
    }
    if(h){
      if(!selected){selected=h.id;renderStage();return;}
      if(selected===h.id){selected=null;renderStage();return;}
      const exists=state.bonds.some(b=>(b.a===selected&&b.b===h.id)||(b.a===h.id&&b.b===selected));
      const first=state.atoms.find(a=>a.id===selected);
      if(!exists&&togetherAction({between:[first.label||first.el,h.label||h.el],order:1})){push();state.bonds.push({id:nextId(),a:selected,b:h.id});persistStage();}
      selected=null;renderStage();
    }else{selected=null;renderStage();}
  },{passive:false});

  function se(tag,attrs){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e}
  const lpOff=[[0,-1.6],[1.6,0],[0,1.6],[-1.6,0]];
  function renderStage(){
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    state.bonds.forEach(b=>{
      const a=state.atoms.find(x=>x.id===b.a),z=state.atoms.find(x=>x.id===b.b);
      if(a&&z)svg.appendChild(se("line",{x1:a.x,y1:a.y,x2:z.x,y2:z.y,stroke:"#16232B","stroke-width":3}));
    });
    state.atoms.forEach(a=>{
      const n=loneCount(a.id);
      for(let i=0;i<n;i++){
        const o=lpOff[i%lpOff.length],cx=a.x+o[0]*R*1.2,cy=a.y+o[1]*R*1.2;
        const dx=o[1]!==0?5:0,dy=o[0]!==0?5:0;
        svg.appendChild(se("circle",{cx:cx-dx,cy:cy-dy,r:2.8,fill:"#16232B"}));
        svg.appendChild(se("circle",{cx:cx+dx,cy:cy+dy,r:2.8,fill:"#16232B"}));
      }
    });
    state.atoms.forEach(a=>{
      svg.appendChild(se("circle",{cx:a.x,cy:a.y,r:R,fill:"#fff",stroke:selected===a.id?"#2E7D6B":"#C9D3D1","stroke-width":selected===a.id?3.5:2}));
      const t=se("text",{x:a.x,y:a.y+6,"text-anchor":"middle","font-family":"IBM Plex Mono","font-size":20,"font-weight":600,fill:"#16232B"});
      t.textContent=a.el;svg.appendChild(t);
    });
    renderCounter();
    document.getElementById("undoBtn").disabled=!history.length;
    renderTogetherPrompt();
  }
  renderTray();renderStage();
}

  setProgress(app.done?100:45);
  s.innerHTML=`<div class="hero"><div class="eyebrow">Optional unlimited practice</div><h1>Math Gym</h1><p class="lede">Math Gym supplements the Day 1 lesson. Practice here never substitutes for its independent checks.</p></div>
    <div class="modeTabs">${MATH_AREAS.map(a=>`<button class="${gymSkill===a.id?'on':''}" onclick="gymSkill='${a.id}';app.gymCurrent=null;render()">${a.name}</button>`).join("")}</div>
    <div class="card" id="gymCard"></div><button class="btn alt" onclick="returnFromGym()">Return to Day 1 lesson</button>`;
  newGymProblem();
}
function newGymProblem(){
  const area=MATH_AREAS.find(a=>a.id===gymSkill)||MATH_AREAS[0],pool=gymPool(area);
  const item=Day1Session.selectUnseenItem(pool,app.gymHistory,gymSkill);
  app.gymCurrent={skill:gymSkill,itemId:item.id};app.gymHistory.push(gymSkill+":"+item.id);if(app.gymHistory.length>60)app.gymHistory.shift();saveApp();
  const card=document.getElementById("gymCard");
  card.innerHTML=`<div class="kicker">${area.name} · optional practice</div><h2>${item.solveFor?'Solve for '+item.solveFor:mathMarkup(item.q)}</h2>
    ${item.solveFor?'<div class="whiteboard equation">'+mathMarkup(item.q)+'</div><label class="answerTarget" for="gymAns"><span>'+item.solveFor+' =</span></label>':''}
    <input class="input" id="gymAns" inputmode="text" autocomplete="off" placeholder="Your answer"/><div id="gymFb" class="feedback"></div>
    <div class="sectionnav"><button class="btn alt small" onclick="newGymProblem()">New problem</button><button class="btn alt small" onclick="routeGymIdk()">I don't know yet</button><button class="btn small" id="gymCheck">Check</button></div>`;
  document.getElementById("gymCheck").onclick=()=>submitGymAnswer(area,item);
}
function lockGymExcept(id){document.querySelectorAll('#gymCard button,#gymCard input').forEach(el=>el.disabled=el.id!==id)}
function mathSkillFor(id){if(!app.studentModel[id])app.studentModel[id]=StudentModelIdkRouter.createSkill(id);return app.studentModel[id]}
function submitGymAnswer(area,item){
  const ans=document.getElementById("gymAns").value,result=Day1Session.classifyAnswer(ans,mathItemRules(item)),skill=mathSkillFor(area.id),itemId='gym:'+area.id+':'+item.id;
  app.gymAttempts.push({skill:area.id,itemId,answer:ans,errorCode:result.errorCode,correct:result.correct,supported:false});
  const f=document.getElementById("gymFb");f.className="feedback show "+(result.correct?"good":"warn");
  if(result.correct){
    StudentModelIdkRouter.recordAttempt(skill,itemId,true,null,Date.now(),ans);
    f.innerHTML='Correct. This optional practice is recorded, but it does not replace the lesson’s independent check.<div><button class="btn small" id="gymAck">Continue to a fresh problem</button></div>';
    lockGymExcept('gymAck');document.getElementById('gymAck').onclick=newGymProblem;
  }else if(['BLANK','NONNUMERIC','FORMAT_ONLY'].includes(result.errorCode)){
    f.innerHTML=result.message+'<div><button class="btn small" id="gymAck">Okay — try a fresh response</button></div>';
    lockGymExcept('gymAck');document.getElementById('gymAck').onclick=newGymProblem;
  }else{
    const routed=StudentModelIdkRouter.isRemediationActive(skill)?StudentModelIdkRouter.recordRemediationCheck(skill,false,itemId,Date.now()):StudentModelIdkRouter.handleWrongAttempt(skill,itemId,result.errorCode,itemId,Date.now(),ans);
    Day1Session.recordMisconception(app,'gym:'+area.id,result.errorCode);
    f.innerHTML='That response does not fit the governing rule yet. I will not give away this answer. Let’s repair the idea with a different example.<div><button class="btn small" id="gymAck">Teach this another way</button></div>';
    lockGymExcept('gymAck');document.getElementById('gymAck').onclick=()=>showGymRemediation(area,routed);
  } saveApp();
}
function showGymRemediation(area,routed){
  const f=document.getElementById('gymFb'),switched=routed&&routed.action==='SWITCH_REPRESENTATION';
  f.className='feedback show info';f.innerHTML='<h3>Teach · '+area.name+'</h3><p>'+area.mini+'</p><h3>Worked example with different numbers</h3><p>'+area.refresh+'</p>'+(switched?'<div class="rulebox"><b>Different representation:</b> '+REPRESENTATION[area.id]+'</div>':'')+'<p>Next is a different problem. This supported practice cannot award independent completion.</p><button class="btn small" id="gymFresh">Try a fresh problem</button>';
  document.getElementById('gymFresh').onclick=newGymProblem;
}
function routeGymIdk(){
  const area=MATH_AREAS.find(a=>a.id===gymSkill),item=app.gymCurrent,skill=mathSkillFor(area.id);
  StudentModelIdkRouter.handleIdk(skill,StudentModelIdkRouter.IDK_REASONS.DONT_KNOW_START,'gym:'+area.id+':'+item.itemId,null,Date.now());
  app.gymAttempts.push({skill:area.id,itemId:item.itemId,errorCode:'IDK',correct:false,supported:true});showGymRemediation(area,{action:'MODEL_FIRST_DECISION'});saveApp();
}

loadApp();
render();
</script>
</body>
</html>
