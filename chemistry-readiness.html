<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Chemistry Readiness</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
:root{--paper:#EEF1F0;--panel:#FFF;--ink:#16232B;--soft:#4A5D66;--rule:#C9D3D1;--rulesoft:#DFE6E4;--alert:#B5533C;--focus:#2E7D6B;}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding:20px 18px 80px}
h1{font-size:30px;line-height:1.12;letter-spacing:-.02em;margin:6px 0 14px;font-weight:600}
h2{font-size:26px;line-height:1.15;margin:4px 0 6px;font-weight:600}
p{line-height:1.55}
.mono,.eyebrow,.conf-label,.bar-t,.mod-time,.q-count{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{max-width:620px;margin:0 auto;padding:12px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-mod{display:flex;align-items:baseline;gap:10px;min-width:0}
.bar-n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--ink)}
.bar-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-r{display:flex;align-items:center;gap:12px}
.barsave{background:none;border:1px solid var(--rule);border-radius:3px;padding:6px 10px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);cursor:pointer;white-space:nowrap}
.timer{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--alert)}
.track{height:2px;background:var(--rulesoft)}
.fill{height:2px;background:#2E7D6B;transition:width .3s ease}
.lede{font-size:17px;color:var(--soft);margin:0 0 18px}
.honest{border-left:3px solid #C9A227;padding:2px 0 2px 14px;margin:0 0 20px}
.honest p{margin:0;font-size:15px}
.rules{list-style:none;padding:0;margin:0 0 26px;border-top:1px solid var(--rulesoft)}
.rules li{border-bottom:1px solid var(--rulesoft);padding:11px 0;font-size:14.5px;color:var(--soft);line-height:1.45}
.mod-n{font-family:'IBM Plex Mono',monospace;font-size:56px;font-weight:600;line-height:1;color:var(--rule)}
.mod-time{margin:8px 0 16px}
.mod-note{font-size:15.5px;color:var(--soft);margin:0 0 22px;white-space:pre-wrap}
.warn{border:1px solid var(--alert);color:var(--alert);border-radius:3px;padding:11px 13px;font-size:14px;line-height:1.45;margin:0 0 22px}
.warn.tight{margin:14px 0 0}
.ok{border:1px solid var(--focus);color:var(--focus);border-radius:3px;padding:11px 13px;font-size:14px;margin:0 0 22px}
.q-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:18px}
.q-id{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;letter-spacing:.04em}
.q-prompt{font-size:18px;line-height:1.48;white-space:pre-wrap;margin:0 0 18px}
.paper-note{background:var(--panel);border:1px dashed var(--rule);border-radius:3px;padding:11px 13px;font-size:14px;color:var(--soft);line-height:1.45;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--panel);border:1px solid var(--rulesoft);border-radius:3px;padding:13px 14px;font:inherit;font-size:15.5px;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.opt-k{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--soft);min-width:14px;padding-top:2px}
.opt.on .opt-k{color:var(--ink);font-weight:600}
.opt-v{flex:1;line-height:1.4}
.in,.ta{width:100%;background:var(--panel);border:1px solid var(--rulesoft);border-radius:3px;padding:13px 14px;font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--ink);margin-bottom:20px}
.ta{font-family:'IBM Plex Sans',sans-serif;line-height:1.5;resize:vertical}
.in:focus,.ta:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
.conf-block{border-top:1px solid var(--rulesoft);padding-top:16px;margin-bottom:8px}
.conf-label{display:block;margin-bottom:10px}
.conf-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.conf-btn{display:flex;align-items:center;gap:9px;border:1px solid var(--rulesoft);background:transparent;color:var(--soft);border-radius:3px;padding:11px 12px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left}
.conf-code{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--rulesoft)}
.nav-r{display:flex;align-items:center;gap:10px}
.saved{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#2E7D6B;letter-spacing:.08em}
.go{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:3px;padding:14px 22px;font-family:'IBM Plex Sans',sans-serif;font-size:15.5px;font-weight:500;cursor:pointer;width:100%}
.go.sm{width:auto;padding:11px 20px;font-size:14.5px}
.go.alt{background:transparent;color:var(--ink);margin-top:8px}
.go:disabled{opacity:.3;cursor:not-allowed}
.ghost{background:none;border:none;color:var(--soft);font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;cursor:pointer;padding:12px 0;width:100%;text-decoration:underline;text-underline-offset:3px}
.ghost.sm{width:auto;padding:11px 4px}
.ghost:disabled{opacity:.3;cursor:not-allowed;text-decoration:none}
.hint{font-size:13px;color:#C9A227;margin-top:12px;line-height:1.4}
.u1-rule{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:15px;margin-bottom:18px}
.u1-rule p{font-size:15px;margin:0 0 9px}
.u1-body{font-size:16px;margin:0 0 13px}
.u1-struct{font-family:'IBM Plex Mono',monospace;font-size:15px;line-height:1.5;background:var(--panel);border:1px solid var(--rulesoft);border-radius:3px;padding:16px;margin:0 0 14px;overflow-x:auto}
.steps{padding-left:20px;margin:0 0 24px}
.steps li{font-size:15.5px;line-height:1.5;margin-bottom:10px;color:var(--soft)}
details{margin:18px 0}
summary{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);cursor:pointer;padding:8px 0}
.raw{background:var(--panel);border:1px solid var(--rulesoft);border-radius:3px;padding:13px;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.5;max-height:300px;overflow:auto;white-space:pre-wrap;color:var(--soft)}
@media(max-width:400px){h1{font-size:26px}.conf-row{grid-template-columns:1fr}.mod-n{font-size:46px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.locked-note{background:var(--panel);border:1px solid var(--rulesoft);border-radius:3px;padding:11px 13px;font-size:13.5px;color:var(--soft);line-height:1.45;margin:0 0 16px}
.locked-show{border-top:1px solid var(--rulesoft);padding-top:14px}
.locked-row{display:flex;gap:12px;padding:7px 0;font-size:14.5px}
.locked-k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);min-width:108px;padding-top:3px}
.locked-v{flex:1;color:var(--ink)}
</style>

    title: "Unfamiliar problems",
    time: "About 20 minutes",
    note: "This part is not about right answers. It is about showing your thinking. Write down the wrong turns too. A messy page with visible dead ends is worth more here than a clean answer.",
    timed: false,
    confidence: false,
    items: [
      { id: "U1", type: "long", isU1: true, prompt: "Apply a rule you have just been given." },
      { id: "U2a", type: "long", prompt: "A solution is made by dissolving 4.60 g of a compound in enough water to make 250.0 mL. The resulting solution has a pH of 2.87. What is the molar mass of the compound?\n\nDo not try to solve this. It may or may not contain enough information to be solvable, and deciding that is part of the task.\n\n(a) What do you already know that is relevant to this problem?" },
      { id: "U2b", type: "long", prompt: "(b) What specific piece of information, assumption, or formula would you need in order to finish it? If you think something is missing, say what." },
      { id: "U2c", type: "long", prompt: "(c) What would your very first move be if you had to start?" },
      { id: "U3", type: "long", prompt: "A rate of reaction is measured as 0.024 mol/L per second. Express this rate in millimoles per liter per minute.\n\nThen answer: how do you know your answer is right?" },
      { id: "U4a", type: "long", prompt: "Think back over Modules 2 and 3. Which single question are you least confident you got right, and why?" },
      { id: "U4b", type: "long", prompt: "Which question did you mark \"I know this\" but now feel less sure about?" },
      { id: "U4c", type: "long", prompt: "Was there any point where you felt yourself giving up rather than working through it? Which question?" },
    ],
  },
];
var CONF=[{code:"A",label:"I know this",c:"#2E7D6B"},{code:"B",label:"I think I know this",c:"#6BA292"},{code:"C",label:"I am unsure",c:"#C9A227"},{code:"D",label:"I guessed",c:"#B5533C"}];
var TOTAL=MODULES.reduce(function(n,m){return n+m.items.length},0);
var KEY="ochem-diagnostic-v13";
var S={screen:"intro",mi:0,ii:0,responses:{},saveOk:null,timeUp:false,enter:Date.now(),msg:""};

function storeOk(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true}catch(e){return false}}
function save(){if(S.screen==="intro"){return}try{localStorage.setItem(KEY,JSON.stringify({mi:S.mi,ii:S.ii,screen:S.screen,responses:S.responses}));S.saveOk=true}catch(e){S.saveOk=false}}
function load(){try{var r=localStorage.getItem(KEY);if(!r)return;var o=JSON.parse(r);var mi=Math.min(Math.max(o.mi||0,0),MODULES.length-1);var ii=Math.min(Math.max(o.ii||0,0),MODULES[mi].items.length-1);S.responses=o.responses||{};S.mi=mi;S.ii=ii;if(o.screen)S.screen=o.screen}catch(e){}}

function mod(){return MODULES[S.mi]}
function item(){return mod().items[S.ii]}
function cur(){return S.responses["r:"+item().id]||{}}
function answered(){return Object.keys(S.responses).filter(function(k){return k.indexOf("r:")===0}).length}

function record(patch){var id=item().id,k="r:"+id,p=S.responses[k]||{};var ms=(p.ms||0)+(Date.now()-S.enter);S.enter=Date.now();var o={};for(var x in p)o[x]=p[x];for(var y in patch)o[y]=patch[y];o.ms=ms;S.responses[k]=o;save()}

function remaining(){var m=mod();if(!m.timed)return null;var st=S.responses[m.id+"-start"];if(!st)return m.timed;return m.timed-Math.floor((Date.now()-st)/1000)}
function startClock(){var m=mod();if(m.timed&&!S.responses[m.id+"-start"]){S.responses[m.id+"-start"]=Date.now();save()}}

function esc(t){var d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML}

function buildExport(){
  var L=[];L.push("ORGANIC CHEMISTRY READINESS DIAGNOSTIC v1.3 + v1.4");L.push("Raw response export. Score against the administrator manuals.");
  L.push("Saved: "+new Date().toLocaleString());L.push("Items answered: "+answered()+" of "+TOTAL);
  if(answered()<TOTAL)L.push("*** PARTIAL EXPORT. Not finished. Later files from this student supersede this one. ***");
  L.push("");
  MODULES.forEach(function(m){
    L.push(new Array(53).join("="));L.push("MODULE "+m.n+"  "+m.title);
    var st=S.responses[m.id+"-start"];if(st)L.push("Module started: "+new Date(st).toLocaleTimeString());
    L.push(new Array(53).join("="));
    m.items.forEach(function(it){
      var r=S.responses["r:"+it.id]||{};var secs=r.ms?Math.round(r.ms/1000):0;var a=r.answer;
      if(Object.prototype.toString.call(a)==="[object Array]")a=a.join("; ");
      if(a===undefined||a==="")a="[BLANK]";
      L.push("");L.push("["+it.id+"]  time "+secs+"s"+(r.conf?"  confidence "+r.conf:"")+(it.type==="draw"?"  (PAPER: see photo)":""));
      L.push(String(a));
    });L.push("")});
  return L.join("\n")}

function download(){try{var b=new Blob([buildExport()],{type:"text/plain"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download="diagnostic-responses.txt";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},1000);flash("File saved to your downloads")}catch(e){flash("Could not save a file. Use the text box below and copy it by hand.")}}
function copyTxt(){var t=buildExport();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){flash("Copied")},function(){flash("Copy did not work. Use Save as a file instead.")})}else{flash("Copy did not work. Use Save as a file instead.")}}
function flash(m){S.msg=m;render();setTimeout(function(){S.msg="";render()},2600)}

function advance(){var m=mod();var it=item();
  if(m.confidence&&it&&!it.noConf){var k="r:"+it.id;if(S.responses[k]&&!S.responses[k].locked){S.responses[k].locked=true}}
  var ni=S.ii+1;
  if(ni<m.items.length&&!(m.timed&&S.timeUp)){S.ii=ni}
  else if(S.mi+1<MODULES.length){S.mi=S.mi+1;S.ii=0;S.screen="modIntro";S.timeUp=false}
  else{S.screen="done"}
  S.enter=Date.now();save();render();window.scrollTo(0,0)}
function back(){if(S.ii>0){S.ii--}else if(S.mi>0){S.mi--;S.ii=MODULES[S.mi].items.length-1}S.enter=Date.now();save();render();window.scrollTo(0,0)}
function reset(){if(!confirm("Clear everything and start over? This cannot be undone."))return;try{localStorage.removeItem(KEY)}catch(e){}S.responses={};S.mi=0;S.ii=0;S.screen="intro";S.timeUp=false;render()}

function render(){
  var m=MODULES[S.mi];var H="";
  if(S.screen!=="intro"&&S.screen!=="done"){
    var rem=remaining();var pct=(answered()/TOTAL)*100;
    H+='<div class="bar"><div class="bar-in"><div class="bar-mod"><span class="bar-n">'+m.n+'</span><span class="bar-t">'+esc(m.title)+'</span></div><div class="bar-r"><button class="barsave" onclick="download()">Save my work</button>'+
       (rem!==null&&S.screen==="question"?'<div class="timer'+(rem<=60?" low":"")+'">'+(rem>0?Math.floor(rem/60)+":"+("0"+(rem%60)).slice(-2):"TIME")+'</div>':"")+
       '</div></div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div></div>'}
  H+='<div class="wrap">';
  if(S.msg)H+='<div class="ok">'+esc(S.msg)+'</div>';

  if(S.screen==="intro"){
    H+='<div class="eyebrow">Chemistry readiness</div><h1>This is not a test you can fail.</h1>'+
    '<p class="lede">Nothing here goes on a transcript. No one is grading you. The only thing it does is work out which three or four things are actually worth your time before classes start, so you do not spend a single day reviewing something you already know.</p>'+
    '<div class="honest"><p><strong>Guessing quietly is what breaks it.</strong> If you mark high confidence on something you actually guessed, this thing will decide you already have it and skip teaching it to you. Rate your confidence honestly and you get a better plan out the other end. That is the whole trade.</p></div>'+
    '<ul class="rules"><li>No notes, no textbook, no internet, no AI. Phone in another room if it is not this one.</li>'+
    '<li>Calculator only where a section says so. Module 01 is no calculator.</li>'+
    '<li>'+(storeOk()?"Your place saves automatically on this device. You can close it and come back.":'This browser is not saving automatically. Use the "Save my work" button at the top after every section and keep the files.')+'</li>'+
    '<li>Section 00 is untimed. Do it whenever, ideally the day before the rest.</li>'+
    '<li>Then two blocks of about 40 minutes: sections 01 and 02, a real break, then 03 and 04.</li>'+
    '<li>If you do not know something, say so and move on. A blank is real information.</li></ul>'+
    '<button class="go" onclick="S.screen=\'modIntro\';save();render()">Start</button>'+
    (answered()>0?'<button class="ghost" onclick="reset()">Clear '+answered()+' saved answers and start over</button>':"")}

  else if(S.screen==="modIntro"){
    H+='<div class="mod-n">'+m.n+'</div><h2>'+esc(m.title)+'</h2><div class="mod-time">'+esc(m.time)+'</div><p class="mod-note">'+esc(m.note)+'</p>';
    if(!storeOk()&&S.mi>0)H+='<div class="warn"><strong>This browser is not saving your progress automatically.</strong> Before you go on, save what you have so far as a file. Do it again after every section, and send your mom every file.<button class="go alt" onclick="download()">Save my work so far</button></div>';
    if(m.timed)H+='<div class="warn">The clock starts when you tap through and it does not pause. If it runs out, the section closes wherever you are. That is intentional.</div>';
    H+='<button class="go" onclick="startClock();S.screen=\'question\';S.enter=Date.now();save();render()">'+(m.timed?"Start the clock":"Begin")+'</button>'}

  else if(S.screen==="question"){
    var it=item(),c=cur();
    if(m.timed&&remaining()<=0)S.timeUp=true;
    H+='<div class="q-head"><span class="q-id">'+it.id+'</span><span class="q-count">'+(S.ii+1)+' / '+m.items.length+'</span></div>';
    if(it.isU1){H+='<div class="u1-rule"><div class="eyebrow">A rule you have not learned yet</div>'+
      '<p>When HBr adds across a carbon-carbon double bond, the reaction goes through a positively charged carbon called a <strong>carbocation</strong>. Carbocations are more stable when the positive carbon has more carbon groups attached to it. A carbon with three attached carbons is much more stable than one with two, which is much more stable than one with one.</p>'+
      '<p><strong>The reaction produces whichever product comes from the more stable carbocation.</strong></p></div>'+
      '<p class="u1-body">Now apply it. Here is 2-methyl-2-butene. You do not need to know the naming system, just read the structure.</p>'+
      '<pre class="u1-struct">        CH\u2083\n         |\n  CH\u2083 \u2500 C \u2550 CH \u2500 CH\u2083</pre>'+
      '<p class="u1-body">The double bond connects the second carbon (the one carrying the extra CH\u2083 branch) to the third carbon (the one carrying one H).</p>'+
      '<p class="u1-body">When HBr adds, the H attaches to one of those two carbons and the Br attaches to the other, giving two possible products. <strong>Which product forms in larger amount, and why?</strong></p>'+
      '<p class="u1-body">Label which carbon becomes positive in each case and count how many carbon groups are attached to it. Draw on paper if that helps, photograph it, and describe your reasoning below.</p>'}
    else{H+='<p class="q-prompt">'+esc(it.prompt)+'</p>'}
    if(it.type==="draw")H+='<div class="paper-note">Draw this on paper, write <strong>'+it.id+'</strong> next to it, and photograph it when you finish. Then describe what you drew below.</div>';
    if(c.locked){H+='<div class="locked-note">You already answered this one and rated your confidence, so it is locked now. You can read it, but changing it after the fact would break what this measures.</div>'}
    if(it.type==="single"&&!c.locked){H+='<div class="opts">';it.options.forEach(function(o,k){H+='<button class="opt'+(c.answer===o?" on":"")+'" onclick="record({answer:'+JSON.stringify(o).replace(/"/g,"&quot;")+'});render()"><span class="opt-k">'+String.fromCharCode(97+k)+'</span><span class="opt-v">'+esc(o)+'</span></button>'});H+='</div>'}
    if(it.type==="multi"&&!c.locked){var arr=c.answer||[];H+='<div class="opts">';it.options.forEach(function(o,k){var on=arr.indexOf(o)>-1;H+='<button class="opt'+(on?" on":"")+'" onclick="toggleMulti('+JSON.stringify(o).replace(/"/g,"&quot;")+');render()"><span class="opt-k">'+(on?"\u2713":"")+'</span><span class="opt-v">'+esc(o)+'</span></button>'});H+='</div>'}
    if((it.type==="short"||it.type==="text")&&!c.locked)H+='<input class="in" type="text" value="'+esc(c.answer||"")+'" placeholder="Your answer" oninput="record({answer:this.value})">';
    if((it.type==="long"||it.type==="draw")&&!c.locked)H+='<textarea class="ta" rows="'+(it.type==="draw"?4:6)+'" placeholder="'+(it.type==="draw"?"Describe what you drew":"Take as much space as you need")+'" oninput="record({answer:this.value})">'+esc(c.answer||"")+'</textarea>';
    if(c.locked){var lab=(CONF.filter(function(x){return x.code===c.conf})[0]||{}).label||"";
      var av=Object.prototype.toString.call(c.answer)==="[object Array]"?c.answer.join("; "):(c.answer||"left blank");
      H+='<div class="locked-show"><div class="locked-row"><span class="locked-k">Your answer</span><span class="locked-v">'+esc(av)+'</span></div>'+
         (c.conf?'<div class="locked-row"><span class="locked-k">Your confidence</span><span class="locked-v">'+esc(c.conf+" "+lab)+'</span></div>':"")+'</div>'}
    if(m.confidence&&!it.noConf&&!c.locked){H+='<div class="conf-block"><span class="conf-label">How confident are you?</span><div class="conf-row">';
      CONF.forEach(function(cf){var on=c.conf===cf.code;H+='<button class="conf-btn" style="'+(on?"border-color:"+cf.c+";background:"+cf.c+";color:#fff":"")+'" onclick="record({conf:\''+cf.code+'\'});render()"><span class="conf-code">'+cf.code+'</span><span>'+cf.label+'</span></button>'});H+='</div></div>'}
    var gate=m.confidence&&!it.noConf&&!c.conf&&!c.locked;
    H+='<div class="nav"><button class="ghost sm" onclick="back()"'+(S.mi===0&&S.ii===0?" disabled":"")+'>Back</button><div class="nav-r">'+
       (S.saveOk===true?'<span class="saved">Saved</span>':"")+
       (!m.timed?'<button class="ghost sm" onclick="advance()">Skip</button>':"")+
       '<button class="go sm" onclick="advance()"'+(gate?" disabled":"")+'>'+(S.ii+1===m.items.length?"Finish section":"Next")+'</button></div></div>';
    if(gate)H+='<div class="hint">Pick a confidence level to continue. That rating is half the data.</div>';
    if(S.timeUp)H+='<div class="warn tight">Time is up for this section. Tap Finish section.</div>';
    if(!storeOk())H+='<div class="warn tight">This browser is not saving automatically. Use "Save my work" at the top before you close this page.</div>'}

  else if(S.screen==="done"){
    H+='<div class="eyebrow">Finished</div><h1>That is all of it.</h1>'+
    '<p class="lede">You answered '+answered()+' of '+TOTAL+'. Blanks are fine and they count as information.</p>'+
    '<ol class="steps"><li>Photograph any paper work you did, especially the drawings and Module 04 scratch. Keep the cross-outs.</li>'+
    '<li>Save or copy your responses below and send them, with the photos, to your mom.</li></ol>'+
    '<button class="go" onclick="download()">Save my responses as a file</button>'+
    '<button class="go alt" onclick="copyTxt()">Or copy them</button>'+
    '<details><summary>See what gets sent</summary><pre class="raw">'+esc(buildExport())+'</pre></details>'+
    '<button class="ghost" onclick="reset()">Clear everything and start over</button>'}
  H+='</div>';
  document.getElementById("root").innerHTML=H;
  var f=document.querySelector(".in,.ta");if(f&&document.activeElement===document.body){}
}
function toggleMulti(o){var c=cur();var arr=(c.answer||[]).slice();var i=arr.indexOf(o);if(i>-1)arr.splice(i,1);else arr.push(o);record({answer:arr})}
load();render();
setInterval(function(){if(S.screen==="question"&&mod().timed)render()},1000);
window.addEventListener("beforeunload",function(e){if(S.screen!=="intro"&&S.screen!=="done"&&!storeOk()){e.preventDefault();e.returnValue=""}});
</script></body></html>
